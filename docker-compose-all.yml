      OC_MODEL_DEVICE: ${OC_MODEL_DEVICE:-auto}
      OC_WORKER_ENGINE: ${OC_WORKER_ENGINE:-real}
      OC_MODEL_PROVISIONING: ${OC_MODEL_PROVISIONING:-verify-existing-only}
      OC_MODEL_CACHE_DIR: /models
      OC_MODEL_OFFLINE: "true"
      OC_NLLB_MODEL_ID: ${OC_NLLB_MODEL_ID:-}
      OC_NLLB_COMMERCIAL_USE: ${OC_NLLB_COMMERCIAL_USE:-true}
      OPENCONNECT_WORKER_TOKEN: ${OPENCONNECT_WORKER_TOKEN:-}
      LICENSE_ACCEPTED: ${LICENSE_ACCEPTED:-0}
    volumes:
