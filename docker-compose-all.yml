# Complete End-to-End Todo Sample Compose Stack
# Combines:
# 1. OpenConnect Blazor Web & Gateway Application (Port 5000)
# 2. Database (PostgreSQL 16)
# 3. Message Broker (NATS JetStream)
# 4. Canonical OpenConnect Worker Services (Security, Inference, Transcription, Kokoro, Playwright, Operational Agents, Outbox)
#
# Environment variables from .env in the root folder are automatically loaded and forwarded.

services:
  # Document processing stays network-isolated and uses protected Unix sockets.
  document-volume-init:
    profiles: ["documents", "vision", "vision-embed", "knowledge-index"]
    build:
      context: .
      dockerfile: workers/document-intelligence/Dockerfile
    image: openconnect-worker-document:${OC_IMAGE_TAG:-e2e-local}
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        chown 10001:10001 /models /worker-socket;
        chmod 0750 /models; chmod 0770 /worker-socket;
        chown 100:101 /clam-socket; chmod 0770 /clam-socket
    network_mode: none
    volumes:
      - oc_document_models:/models
      - oc_document_api_socket:/worker-socket
      - oc_clamav_socket:/clam-socket

  worker-document-init:
    profiles: ["documents", "knowledge-index"]
    image: openconnect-worker-document:${OC_IMAGE_TAG:-e2e-local}
    depends_on:
      document-volume-init:
        condition: service_completed_successfully
    command: ["python", "-m", "openconnect_worker_common.models.initialize"]
    environment:
      OC_MODEL_MANIFEST_PATH: /config/init.json
      OC_MODEL_CACHE_DIR: /models
      OC_MODEL_PROVISIONING: ${OC_MODEL_PROVISIONING:-verify-existing-only}
      OC_MODEL_OFFLINE: ${OC_MODEL_OFFLINE:-true}
    volumes:
      - oc_document_models:/models
      - ${OC_DOCUMENT_INIT_CONFIG:-./workers/document-intelligence/config/unconfigured.json}:/config/init.json:ro
    networks: [oc-network]

  clamav:
    profiles: ["documents", "vision", "vision-embed", "knowledge-index"]
    image: clamav/clamav:1.4_base@sha256:21622d96b8a7080af7974d99ca60a9e061eff5ff831ed6986d00953fc19ff67f
    depends_on:
      document-volume-init:
        condition: service_completed_successfully
    volumes:
      - oc_clamav_database:/var/lib/clamav
      - oc_clamav_socket:/run/clamav
      - ./workers/document-intelligence/config/clamd.conf:/etc/clamav/clamd.conf:ro
    networks: [oc-network]
    healthcheck:
      test: ["CMD", "clamdscan", "--config-file=/etc/clamav/clamd.conf", "--ping", "1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 600s

  worker-document:
    profiles: ["documents", "knowledge-index"]
    image: openconnect-worker-document:${OC_IMAGE_TAG:-e2e-local}
    depends_on:
      worker-document-init:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
    environment:
      OC_DOCUMENT_ENABLED: "true"
      OC_DOCUMENT_ANALYZE_ENABLED: ${OC_DOCUMENT_ANALYZE_ENABLED:-false}
      OC_DOCUMENT_CONFIG_PATH: /config/serve.json
      OC_MODEL_CACHE_DIR: /models
      OC_MODEL_OFFLINE: "true"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      OC_MODEL_PROVISIONING: ${OC_MODEL_PROVISIONING:-verify-existing-only}
      OC_MODEL_DEVICE: cpu
      OC_WORKER_ENGINE: real
      OPENCONNECT_WORKER_TOKEN: ${OPENCONNECT_WORKER_TOKEN:-}
      OPENCONNECT_WORKER_SIGNING_KEY: ${OPENCONNECT_WORKER_SIGNING_KEY:-}
    network_mode: none
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    group_add: ["101"]
    mem_limit: 2g
    pids_limit: 128
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    volumes:
      - oc_document_models:/models:ro
      - oc_document_api_socket:/run/openconnect
      - oc_clamav_socket:/run/clamav:ro
      - ${OC_DOCUMENT_SERVE_CONFIG:-./workers/document-intelligence/config/unconfigured.json}:/config/serve.json:ro
    healthcheck:
      test: ["CMD", "python", "-c", 'import socket; s=socket.socket(socket.AF_UNIX); s.settimeout(3); s.connect("/run/openconnect/worker.sock"); s.sendall(b"GET /health/ready HTTP/1.0\r\n\r\n"); assert b" 200 " in s.recv(128)']
      interval: 15s
      timeout: 5s
      retries: 5

  vision-volume-init:
    profiles: ["vision", "vision-embed"]
    build:
      context: .
      dockerfile: workers/vision/Dockerfile
    image: openconnect-worker-vision:${OC_IMAGE_TAG:-e2e-local}
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command: ["chown 10001:10001 /models /worker-socket; chmod 0750 /models; chmod 0770 /worker-socket"]
    network_mode: none
    volumes:
      - oc_vision_models:/models
      - oc_vision_api_socket:/worker-socket

  worker-vision-init:
    profiles: ["vision"]
    image: openconnect-worker-vision:${OC_IMAGE_TAG:-e2e-local}
    depends_on:
      vision-volume-init:
        condition: service_completed_successfully
    command: ["python", "-m", "openconnect_worker_common.models.initialize"]
    environment:
      OC_MODEL_MANIFEST_PATH: /config/init.json
      OC_MODEL_CACHE_DIR: /models
      OC_MODEL_PROVISIONING: ${OC_MODEL_PROVISIONING:-verify-existing-only}
      OC_MODEL_OFFLINE: ${OC_MODEL_OFFLINE:-true}
    volumes:
      - oc_vision_models:/models
      - ${OC_VISION_INIT_CONFIG:-./workers/vision/config/unconfigured.json}:/config/init.json:ro
    networks: [oc-network]

  worker-vision:
    profiles: ["vision"]
    image: openconnect-worker-vision:${OC_IMAGE_TAG:-e2e-local}
    depends_on:
      worker-vision-init:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
    environment:
      OC_VISION_ENABLED: "true"
      OC_VISION_CONFIG_PATH: /config/serve.json
      OC_MODEL_CACHE_DIR: /models
      OC_MODEL_OFFLINE: "true"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      OC_MODEL_PROVISIONING: ${OC_MODEL_PROVISIONING:-verify-existing-only}
      OC_MODEL_DEVICE: cpu
      OC_WORKER_ENGINE: real
      OPENCONNECT_WORKER_TOKEN: ${OPENCONNECT_WORKER_TOKEN:-}
      OPENCONNECT_WORKER_SIGNING_KEY: ${OPENCONNECT_WORKER_SIGNING_KEY:-}
    network_mode: none
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    group_add: ["101"]
    mem_limit: 2g
    pids_limit: 128
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    volumes:
      - oc_vision_models:/models:ro
      - oc_vision_api_socket:/run/openconnect
      - oc_clamav_socket:/run/clamav:ro
      - ${OC_VISION_SERVE_CONFIG:-./workers/vision/config/unconfigured.json}:/config/serve.json:ro
    healthcheck:
      test: ["CMD", "python", "-c", 'import socket; s=socket.socket(socket.AF_UNIX); s.settimeout(3); s.connect("/run/openconnect/vision.sock"); s.sendall(b"GET /health/ready HTTP/1.0\r\n\r\n"); assert b" 200 " in s.recv(128)']
      interval: 15s
      timeout: 5s
      retries: 5

  worker-vision-embed-init:
    profiles: ["vision-embed"]
    image: openconnect-worker-vision:${OC_IMAGE_TAG:-e2e-local}
    depends_on:
      vision-volume-init:
        condition: service_completed_successfully
    command: ["python", "-m", "openconnect_worker_common.models.initialize"]
    environment:
      OC_MODEL_MANIFEST_PATH: /config/init.json
      OC_MODEL_CACHE_DIR: /models
      OC_MODEL_PROVISIONING: ${OC_MODEL_PROVISIONING:-verify-existing-only}
      OC_MODEL_OFFLINE: ${OC_MODEL_OFFLINE:-true}
    volumes:
      - oc_vision_models:/models
      - ${OC_VISION_EMBED_INIT_CONFIG:-./workers/vision/config/unconfigured.json}:/config/init.json:ro
    networks: [oc-network]

  worker-vision-embed:
    profiles: ["vision-embed"]
    image: openconnect-worker-vision:${OC_IMAGE_TAG:-e2e-local}
    depends_on:
      worker-vision-embed-init:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
    command: ["uvicorn", "openconnect_vision.embedding_app:app", "--uds", "/run/openconnect/vision-embed.sock", "--no-access-log", "--limit-concurrency", "16"]
    environment:
      OC_VISION_EMBED_ENABLED: "true"
      OC_VISION_EMBED_CONFIG_PATH: /config/serve.json
      OC_MODEL_CACHE_DIR: /models
      OC_MODEL_OFFLINE: "true"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      OC_MODEL_PROVISIONING: ${OC_MODEL_PROVISIONING:-verify-existing-only}
      OC_MODEL_DEVICE: cpu
      OC_WORKER_ENGINE: real
      OPENCONNECT_WORKER_TOKEN: ${OPENCONNECT_WORKER_TOKEN:-}
      OPENCONNECT_WORKER_SIGNING_KEY: ${OPENCONNECT_WORKER_SIGNING_KEY:-}
    network_mode: none
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    group_add: ["101"]
    mem_limit: 2g
    pids_limit: 128
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    volumes:
      - oc_vision_models:/models:ro
      - oc_vision_api_socket:/run/openconnect
      - oc_clamav_socket:/run/clamav:ro
      - ${OC_VISION_EMBED_SERVE_CONFIG:-./workers/vision/config/unconfigured.json}:/config/serve.json:ro
    healthcheck:
      test: ["CMD", "python", "-c", 'import socket; s=socket.socket(socket.AF_UNIX); s.settimeout(3); s.connect("/run/openconnect/vision-embed.sock"); s.sendall(b"GET /health/ready HTTP/1.0\r\n\r\n"); assert b" 200 " in s.recv(128)']
      interval: 15s
      timeout: 5s
      retries: 5

  minio-volume-init:
    profiles: ["storage", "storage-init", "storage-tls", "documents", "knowledge-index"]
    image: python:3.12-slim
    user: "0:0"
    network_mode: none
    entrypoint: ["/bin/sh", "-ec"]
    command: ["chown 65532:65532 /data; chmod 0700 /data"]
    volumes:
      - oc_minio_data:/data

  minio:
    profiles: ["storage", "storage-init", "storage-tls", "documents", "knowledge-index"]
    image: cgr.dev/chainguard/minio@sha256:e9cf6b99c226e9539ed0f14b6f00e37b07da153c7ba1f4f8709c807574b471ec
    depends_on:
      minio-volume-init:
        condition: service_completed_successfully
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - 'test -n "$$MINIO_ROOT_USER" && test -n "$$MINIO_ROOT_PASSWORD" && exec /usr/bin/minio server /data --console-address :9001'
    environment:
      MINIO_ROOT_USER: ${OC_MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${OC_MINIO_ROOT_PASSWORD:-}
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,nosuid,size=32m
    volumes:
      - oc_minio_data:/data
    networks: [oc-network]
    healthcheck:
      test: ["CMD", "/bin/bash", "-ec", 'exec 3<>/dev/tcp/127.0.0.1/9000; printf "GET /minio/health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3; IFS= read -r status <&3; [[ "$$status" == *" 200 "* ]]']
      interval: 15s
      timeout: 5s
      retries: 5

  minio-tls:
    profiles: ["storage-tls"]
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    user: "101:101"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    command: ["nginx", "-c", "/etc/nginx/nginx.conf", "-g", "daemon off;"]
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./workers/knowledge/config/minio-tls.conf:/etc/nginx/nginx.conf:ro
      - ${OC_MINIO_TLS_DIRECTORY:-./workers/knowledge/config}:/run/minio-tls:ro
    networks: [oc-network]

  storage-bucket-init:
    profiles: ["storage-init"]
    build:
      context: .
      dockerfile: workers/knowledge/Dockerfile
    image: openconnect-worker-knowledge:${OC_IMAGE_TAG:-e2e-local}
    command: ["python", "-m", "openconnect_knowledge.storage_init"]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      OC_STORAGE_BOOTSTRAP_ENDPOINT: ${OC_STORAGE_BOOTSTRAP_ENDPOINT:-minio:9000}
      OC_STORAGE_BOOTSTRAP_TLS: ${OC_STORAGE_BOOTSTRAP_TLS:-true}
      OC_STORAGE_BOOTSTRAP_CA_FILE: ${OC_STORAGE_BOOTSTRAP_CA_FILE:-}
      OC_STORAGE_BOOTSTRAP_BUCKET: ${OC_STORAGE_BOOTSTRAP_BUCKET:-}
      OC_STORAGE_BOOTSTRAP_ACCESS_KEY: ${OC_STORAGE_BOOTSTRAP_ACCESS_KEY:-}
      OC_STORAGE_BOOTSTRAP_SECRET_KEY: ${OC_STORAGE_BOOTSTRAP_SECRET_KEY:-}
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ${OC_MINIO_CA_DIRECTORY:-./workers/knowledge/config}:/run/minio-ca:ro
    networks: [oc-network]

  worker-knowledge-init:
    profiles: ["knowledge", "knowledge-index", "knowledge-cloud"]
    build:
      context: .
      dockerfile: workers/knowledge/Dockerfile
    image: openconnect-worker-knowledge:${OC_IMAGE_TAG:-e2e-local}
    command: ["python", "-m", "openconnect_worker_common.models.initialize"]
    environment:
      OC_MODEL_MANIFEST_PATH: /config/init.json
      OC_MODEL_CACHE_DIR: /models
      OC_MODEL_PROVISIONING: ${OC_MODEL_PROVISIONING:-verify-existing-only}
      OC_MODEL_OFFLINE: ${OC_MODEL_OFFLINE:-true}
    volumes:
      - oc_knowledge_models:/models
      - ${OC_KNOWLEDGE_INIT_CONFIG:-./workers/knowledge/config/unconfigured.json}:/config/init.json:ro
    networks:
      - oc-network

  worker-knowledge:
    profiles: ["knowledge", "knowledge-cloud"]
    image: openconnect-worker-knowledge:${OC_IMAGE_TAG:-e2e-local}
    depends_on:
      worker-knowledge-init:
        condition: service_completed_successfully
    environment:
      OC_KNOWLEDGE_ENABLED: "true"
      OC_KNOWLEDGE_CONFIG_PATH: /config/serve.json
      OC_MODEL_CACHE_DIR: /models
      OC_MODEL_OFFLINE: "true"
      OC_MODEL_PROVISIONING: ${OC_MODEL_PROVISIONING:-verify-existing-only}
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      OPENCONNECT_WORKER_TOKEN: ${OPENCONNECT_WORKER_TOKEN:-}
      OPENCONNECT_WORKER_SIGNING_KEY: ${OPENCONNECT_WORKER_SIGNING_KEY:-}
      OC_KNOWLEDGE_CLOUD_CONSUMPTION_ENABLED: ${OC_KNOWLEDGE_CLOUD_CONSUMPTION_ENABLED:-false}
      OC_KNOWLEDGE_CLOUD_AUTHORITY_ORIGIN: ${OC_KNOWLEDGE_CLOUD_AUTHORITY_ORIGIN:-}
      OC_KNOWLEDGE_CLOUD_CA_FILE: /run/knowledge-cloud-worker/ca.crt
      OC_KNOWLEDGE_CLOUD_CERT_FILE: /run/knowledge-cloud-worker/client.crt
      OC_KNOWLEDGE_CLOUD_KEY_FILE: /run/knowledge-cloud-worker/client.key
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - oc_knowledge_models:/models:ro
      - ${OC_KNOWLEDGE_SERVE_CONFIG:-./workers/knowledge/config/unconfigured.json}:/config/serve.json:ro
      - ${OC_KNOWLEDGE_CLOUD_SECRETS_DIR:-./workers/knowledge/config}:/run/knowledge-cloud-worker:ro
    networks:
      - oc-network

  knowledge-embedding-tls:
    profiles: ["knowledge-cloud"]
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    user: "101:101"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    command: ["nginx", "-c", "/etc/nginx/nginx.conf", "-g", "daemon off;"]
    depends_on:
      worker-knowledge:
        condition: service_started
    volumes:
      - ./cloud/knowledge-embedding-tls/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${CLOUD_KNOWLEDGE_TLS_SECRETS_DIR:-./workers/knowledge/config}:/run/knowledge-embedding-tls:ro
    networks: [oc-network]
    restart: unless-stopped

  worker-knowledge-migrate:
    profiles: ["knowledge-migrate"]
    build:
      context: .
      dockerfile: workers/knowledge/Dockerfile
    image: openconnect-worker-knowledge:${OC_IMAGE_TAG:-e2e-local}
    command: ["python", "-m", "openconnect_knowledge.migrate"]
    environment:
      OC_KNOWLEDGE_MIGRATION_DSN: ${OC_KNOWLEDGE_MIGRATION_DSN:-}
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    networks: [oc-network]

  worker-knowledge-index:
    profiles: ["knowledge-index"]
    image: openconnect-worker-knowledge:${OC_IMAGE_TAG:-e2e-local}
    command: ["python", "-m", "openconnect_knowledge.index_worker"]
    depends_on:
      worker-knowledge-init:
        condition: service_completed_successfully
      worker-document:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      OC_INDEX_WORKER_ENABLED: "true"
      OC_KNOWLEDGE_ENABLED: "true"
      OC_KNOWLEDGE_CONFIG_PATH: /config/serve.json
      OC_KNOWLEDGE_SEARCH_DSN: ${OC_KNOWLEDGE_SEARCH_DSN:-}
      OC_MODEL_CACHE_DIR: /models
      OC_MODEL_OFFLINE: "true"
      OC_MODEL_PROVISIONING: ${OC_MODEL_PROVISIONING:-verify-existing-only}
      OC_MODEL_DEVICE: cpu
      OC_WORKER_ENGINE: real
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      OC_INDEX_CLAM_SOCKET: /run/clamav/clamd.sock
      OC_INDEX_DOCUMENT_SOCKET: /run/openconnect/worker.sock
      OC_INDEX_MINIO_ENDPOINT: ${OC_INDEX_MINIO_ENDPOINT:-minio:9000}
      OC_INDEX_MINIO_TLS: ${OC_INDEX_MINIO_TLS:-true}
      OC_INDEX_MINIO_CA_FILE: ${OC_INDEX_MINIO_CA_FILE:-}
      OC_INDEX_MINIO_BUCKET: ${OC_INDEX_MINIO_BUCKET:-}
      OC_INDEX_MINIO_ACCESS_KEY: ${OC_INDEX_MINIO_ACCESS_KEY:-}
      OC_INDEX_MINIO_SECRET_KEY: ${OC_INDEX_MINIO_SECRET_KEY:-}
      OPENCONNECT_WORKER_TOKEN: ${OPENCONNECT_WORKER_TOKEN:-}
      OPENCONNECT_WORKER_SIGNING_KEY: ${OPENCONNECT_WORKER_SIGNING_KEY:-}
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    group_add: ["101"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    volumes:
      - oc_knowledge_models:/models:ro
      - oc_document_api_socket:/run/openconnect:ro
      - oc_clamav_socket:/run/clamav:ro
      - ${OC_MINIO_CA_DIRECTORY:-./workers/knowledge/config}:/run/minio-ca:ro
      - ${OC_KNOWLEDGE_SERVE_CONFIG:-./workers/knowledge/config/unconfigured.json}:/config/serve.json:ro
    networks: [oc-network]

  worker-knowledge-expiry:
    profiles: ["knowledge-index"]
    build:
      context: .
      dockerfile: workers/knowledge/Dockerfile
    image: openconnect-worker-knowledge:${OC_IMAGE_TAG:-e2e-local}
    command: ["python", "-m", "openconnect_knowledge.expiration_worker"]
    environment:
      OC_INDEX_EXPIRY_ENABLED: "true"
      OC_KNOWLEDGE_SEARCH_DSN: ${OC_KNOWLEDGE_SEARCH_DSN:-}
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    networks: [oc-network]

  worker-knowledge-image:
    profiles: ["knowledge-image"]
    build:
      context: .
      dockerfile: workers/knowledge/Dockerfile
    image: openconnect-worker-knowledge:${OC_IMAGE_TAG:-e2e-local}
    environment:
      OC_KNOWLEDGE_IMAGE_ENABLED: "true"
      OC_KNOWLEDGE_SEARCH_DSN: ${OC_KNOWLEDGE_SEARCH_DSN:-}
      OPENCONNECT_WORKER_TOKEN: ${OPENCONNECT_WORKER_TOKEN:-}
      OPENCONNECT_WORKER_SIGNING_KEY: ${OPENCONNECT_WORKER_SIGNING_KEY:-}
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    networks: [oc-network]

  worker-knowledge-index-api:
    profiles: ["knowledge-index"]
    image: openconnect-worker-knowledge:${OC_IMAGE_TAG:-e2e-local}
    depends_on:
      worker-knowledge-index:
        condition: service_started
    environment:
      OC_KNOWLEDGE_ENABLED: "false"
      OC_INDEX_SUBMISSION_ENABLED: "true"
      OC_INDEX_DELETE_ENABLED: ${OC_INDEX_DELETE_ENABLED:-false}
      OC_KNOWLEDGE_SEARCH_DSN: ${OC_KNOWLEDGE_SEARCH_DSN:-}
      OPENCONNECT_WORKER_TOKEN: ${OPENCONNECT_WORKER_TOKEN:-}
      OPENCONNECT_WORKER_SIGNING_KEY: ${OPENCONNECT_WORKER_SIGNING_KEY:-}
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    networks: [oc-network]

  worker-knowledge-rerank-init:
    profiles: ["knowledge-rerank"]
    build:
      context: .
      dockerfile: workers/knowledge/Dockerfile
    image: openconnect-worker-knowledge:${OC_IMAGE_TAG:-e2e-local}
    command: ["python", "-m", "openconnect_worker_common.models.initialize"]
    environment:
      OC_MODEL_MANIFEST_PATH: /config/init.json
      OC_MODEL_CACHE_DIR: /models
      OC_MODEL_PROVISIONING: ${OC_MODEL_PROVISIONING:-verify-existing-only}
      OC_MODEL_OFFLINE: ${OC_MODEL_OFFLINE:-true}
    volumes:
      - oc_knowledge_models:/models
      - ${OC_RERANK_INIT_CONFIG:-./workers/knowledge/config/unconfigured.json}:/config/init.json:ro
    networks:
      - oc-network

  worker-knowledge-rerank:
    profiles: ["knowledge-rerank"]
    image: openconnect-worker-knowledge:${OC_IMAGE_TAG:-e2e-local}
    depends_on:
      worker-knowledge-rerank-init:
        condition: service_completed_successfully
    environment:
      OC_KNOWLEDGE_ENABLED: "false"
      OC_RERANK_ENABLED: "true"
      OC_RERANK_CONFIG_PATH: /config/serve.json
      OC_KNOWLEDGE_SEARCH_ENABLED: ${OC_KNOWLEDGE_SEARCH_ENABLED:-false}
      OC_KNOWLEDGE_SEARCH_DSN: ${OC_KNOWLEDGE_SEARCH_DSN:-}
      OC_MODEL_CACHE_DIR: /models
      OC_MODEL_OFFLINE: "true"
      OC_MODEL_PROVISIONING: ${OC_MODEL_PROVISIONING:-verify-existing-only}
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      OPENCONNECT_WORKER_TOKEN: ${OPENCONNECT_WORKER_TOKEN:-}
