  # Public documentation and optional Cloud control plane.
  documentation-site:
    build:
      context: .
      dockerfile: site/OpenConnect.Docs/Dockerfile
    image: openconnect-docs:${OC_IMAGE_TAG:-e2e-local}
    container_name: oc-docs-local
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: ${CLOUD_DOCS_URLS:-http://+:8080}
      ASPNETCORE_Kestrel__Certificates__Default__Path: ${CLOUD_DOCS_TLS_CERTIFICATE_PATH:-}
      ASPNETCORE_Kestrel__Certificates__Default__Password: ${CLOUD_DOCS_TLS_CERTIFICATE_PASSWORD:-}
      OpenConnect__Cloud__HostPrivacyTrust__Enabled: ${CLOUD_HOST_PRIVACY_TRUST_ENABLED:-false}
      OpenConnect__Cloud__HostPrivacyTrust__ClientCertificateSha256__0: ${CLOUD_HOST_PRIVACY_CERTIFICATE_SHA256:-}
      OpenConnect__Cloud__Identity__Enabled: ${CLOUD_OIDC_ENABLED:-false}
      OpenConnect__Cloud__Identity__Authority: ${CLOUD_OIDC_AUTHORITY:-}
      OpenConnect__Cloud__Identity__ClientId: ${CLOUD_OIDC_CLIENT_ID:-}
      OpenConnect__Cloud__Identity__ClientSecret: ${CLOUD_OIDC_CLIENT_SECRET:-}
      OpenConnect__Cloud__Identity__Google__Enabled: ${CLOUD_GOOGLE_ENABLED:-false}
