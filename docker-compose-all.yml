      - "127.0.0.1:${CLOUD_GATEWAY_PORT:-8091}:8091"
    networks:
      - oc-network

  # =========================================================================
  # 1. OpenConnect Blazor Web UI & Interactive Gateway Application
  # =========================================================================
  todo-web-app:
    build:
      context: .
      dockerfile: samples/Blazor/Dockerfile
    image: vuminkosimatibe/openconnect-sample-todo:${OC_IMAGE_TAG:-e2e-local}
    container_name: oc-todo-web-app
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      OpenConnect__Gateway__Mode: ${TODO_GATEWAY_MODE:-SameHostGateway}
      OpenConnect__Gateway__SameHostBaseUrl: http://127.0.0.1:5000
      OPENCONNECT_BLAZOR_SQLITE_PATH: /data/blazor-todo.db
      GATEWAY_URL: http://gateway-host:8080/openconnect/v1/
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-openconnect};Username=${POSTGRES_USER:-openconnect};Password=${POSTGRES_PASSWORD:-openconnect_dev_password}"
      Nats__Url: ${NATS_URL:-nats://nats:4222}
      Workers__Security__Endpoint: http://worker-security:8080
      Workers__Inference__Endpoint: http://worker-inference:8080
      Workers__Transcription__Endpoint: http://worker-transcription:8080
      Workers__Kokoro__Endpoint: http://worker-kokoro:8080
      OPENCONNECT_WORKER_TOKEN: ${OPENCONNECT_WORKER_TOKEN:-}
      OPENCONNECT_INFERENCE_TOKEN: ${OPENCONNECT_INFERENCE_TOKEN:-${OPENCONNECT_WORKER_TOKEN:-}}
      OPENCONNECT_WORKER_SIGNING_KEY: ${OPENCONNECT_WORKER_SIGNING_KEY:-}
      OpenConnect__DocumentDemo__Enabled: ${OC_TODO_DOCUMENT_DEMO_ENABLED:-false}
      OpenConnect__CloudPrivacy__Enabled: ${OC_TODO_CLOUD_PRIVACY_ENABLED:-false}
      OpenConnect__CloudPrivacy__Origin: ${OC_TODO_CLOUD_PRIVACY_ORIGIN:-}
      OpenConnect__CloudPrivacy__Credential: ${OC_TODO_CLOUD_PRIVACY_CREDENTIAL:-}
      OpenConnect__CloudPrivacy__ServerCertificateSha256: ${OC_TODO_CLOUD_PRIVACY_SERVER_SHA256:-}
      OpenConnect__CloudPrivacy__CertificatePath: ${OC_TODO_CLOUD_PRIVACY_CERTIFICATE_PATH:-/data/cloud-privacy-client.pfx}
      OpenConnect__CloudPrivacy__CertificatePassword: ${OC_TODO_CLOUD_PRIVACY_CERTIFICATE_PASSWORD:-}
      OpenConnect__DocumentDemo__DocumentSocket: /run/openconnect-document/worker.sock
      OpenConnect__DocumentDemo__ExtractionOrigin: ${OC_TODO_EXTRACTION_ORIGIN:-http://worker-inference:8080}
      OpenConnect__DocumentDemo__AllowInsecureHttp: ${OC_TODO_EXTRACTION_ALLOW_HTTP:-false}
      OpenConnect__KnowledgeDemo__Enabled: ${OC_TODO_KNOWLEDGE_DEMO_ENABLED:-false}
      OpenConnect__KnowledgeDemo__IndexOrigin: ${OC_TODO_KNOWLEDGE_INDEX_ORIGIN:-http://worker-knowledge-index-api:8080}
      OpenConnect__KnowledgeDemo__SearchOrigin: ${OC_TODO_KNOWLEDGE_SEARCH_ORIGIN:-http://worker-knowledge-rerank:8080}
      OpenConnect__KnowledgeDemo__EmbeddingOrigin: ${OC_TODO_KNOWLEDGE_EMBEDDING_ORIGIN:-http://worker-knowledge:8080}
      OpenConnect__KnowledgeDemo__UseCloudEmbedding: ${OC_TODO_KNOWLEDGE_USE_CLOUD_EMBEDDING:-false}
      OpenConnect__KnowledgeDemo__CloudBearerToken: ${OC_TODO_KNOWLEDGE_CLOUD_BEARER_TOKEN:-}
      OpenConnect__KnowledgeDemo__AllowInsecureHttp: ${OC_TODO_KNOWLEDGE_ALLOW_HTTP:-false}
      OpenConnect__KnowledgeDemo__ObjectId: ${OC_TODO_KNOWLEDGE_OBJECT_ID:-}
      OpenConnect__KnowledgeDemo__ObjectSha256: ${OC_TODO_KNOWLEDGE_OBJECT_SHA256:-}
      OpenConnect__KnowledgeDemo__ObjectSize: ${OC_TODO_KNOWLEDGE_OBJECT_SIZE:-}
      OpenConnect__KnowledgeDemo__ObjectVersion: ${OC_TODO_KNOWLEDGE_OBJECT_VERSION:-}
      OpenConnect__KnowledgeDemo__EmbeddingSpaceId: ${OC_TODO_KNOWLEDGE_EMBEDDING_SPACE_ID:-}
      OpenConnect__CapabilityMonitor__Enabled: ${OC_TODO_CAPABILITY_MONITOR_ENABLED:-false}
      OpenConnect__CapabilityMonitor__AllowInsecureHttp: ${OC_TODO_CAPABILITY_MONITOR_ALLOW_HTTP:-false}
      OpenConnect__CapabilityMonitor__DocumentEndpoint: ${OC_TODO_CAPABILITY_DOCUMENT_ENDPOINT:-/run/openconnect-document/worker.sock}
      OpenConnect__CapabilityMonitor__KnowledgeEndpoint: ${OC_TODO_CAPABILITY_KNOWLEDGE_ENDPOINT:-http://worker-knowledge:8080}
      OpenConnect__CapabilityMonitor__RerankEndpoint: ${OC_TODO_CAPABILITY_RERANK_ENDPOINT:-http://worker-knowledge-rerank:8080}
      OpenConnect__CapabilityMonitor__IndexEndpoint: ${OC_TODO_CAPABILITY_INDEX_ENDPOINT:-http://worker-knowledge-index-api:8080}
      OpenConnect__CapabilityMonitor__VisionEndpoint: ${OC_TODO_CAPABILITY_VISION_ENDPOINT:-/run/openconnect-vision/vision.sock}
      OpenConnect__CapabilityMonitor__VisionEmbedEndpoint: ${OC_TODO_CAPABILITY_VISION_EMBED_ENDPOINT:-/run/openconnect-vision/vision-embed.sock}
      OpenConnect__CapabilityMonitor__AnalyticsEndpoint: ${OC_TODO_CAPABILITY_ANALYTICS_ENDPOINT:-http://worker-analytics:8080}
      OpenConnect__CapabilityMonitor__InferenceEndpoint: ${OC_TODO_CAPABILITY_INFERENCE_ENDPOINT:-http://worker-inference:8080}
      Workers__Playwright__Endpoint: http://worker-playwright:8080
      # Pass through Cloud Inference / Model configuration from .env
      OpenConnect__ApiKey: ${OpenConnect__ApiKey:-}
      OpenConnect__ApiUrl: ${OpenConnect__ApiUrl:-}
      OpenConnect__ReasoningModel: ${OpenConnect__ReasoningModel:-}
      OpenConnect__ReasoningBackend: ${OpenConnect__ReasoningBackend:-}
      OpenConnect__Reasoning__Serverless__Endpoint: ${OpenConnect__Reasoning__Serverless__Endpoint:-}
      OpenConnect__Reasoning__Serverless__Model: ${OpenConnect__Reasoning__Serverless__Model:-}
      OpenConnect__Reasoning__Serverless__ApiKey: ${OpenConnect__Reasoning__Serverless__ApiKey:-}
      OpenConnect__MetaApiKey: ${OpenConnect__MetaApiKey:-}
      OpenConnect__MetaApiUrl: ${OpenConnect__MetaApiUrl:-}
      OpenConnect__MetaModel: ${OpenConnect__MetaModel:-}
      OpenConnect__ClaudeApiKey: ${OpenConnect__ClaudeApiKey:-}
      OpenConnect__ClaudeApiUrl: ${OpenConnect__ClaudeApiUrl:-}
      OpenConnect__ClaudeModel: ${OpenConnect__ClaudeModel:-}
      # Cloud Speech / Transcription
      OpenConnect__ASR_MODEL: ${OpenConnect__ASR_MODEL:-}
      OpenConnect__ASR_WSS: ${OpenConnect__ASR_WSS:-}
      OpenConnect__ASR_Transcription__URL: ${OpenConnect__ASR_Transcription__URL:-}
      OpenConnect__TranscriptionModel: ${OpenConnect__TranscriptionModel:-}
      OpenConnect__TranscriptionApiUrl: ${OpenConnect__TranscriptionApiUrl:-}
      OPENCONNECT_TTS_INTERNAL_KEY: ${OPENCONNECT_TTS_INTERNAL_KEY:-}
      TODO_INTERNAL_TOKEN: ${TODO_INTERNAL_TOKEN:-e2e-todo-internal-do-not-use-in-prod}
      TODO_INTERNAL_TENANT: ${TODO_INTERNAL_TENANT:-01ARZ3NDEKTSV4RRFFQ69G5FAV}
    volumes:
      - oc_todo_app_data:/data
      - oc_document_api_socket:/run/openconnect-document:ro
      - oc_vision_api_socket:/run/openconnect-vision:ro
    group_add: ["10001"]
    networks:
      - oc-network
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy

  # =========================================================================
  # 2. Relational Database (PostgreSQL)
  # =========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: oc-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-openconnect}
      POSTGRES_USER: ${POSTGRES_USER:-openconnect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openconnect_dev_password}
    volumes:
      - oc_postgres_data:/var/lib/postgresql/data
    networks:
      - oc-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openconnect} -d ${POSTGRES_DB:-openconnect}"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 2s

  # =========================================================================
  # 3. Messaging Transport (NATS JetStream)
  # =========================================================================
  nats:
    image: nats:2.10-alpine
    container_name: oc-nats
    command: ["-js", "-m", "8222"]
    ports:
      - "${NATS_CLIENT_PORT:-4222}:4222"
      - "${NATS_MONITOR_PORT:-8222}:8222"
    environment:
      NATS_APP_USER: ${NATS_APP_USER:-}
      NATS_APP_PASSWORD: ${NATS_APP_PASSWORD:-}
    networks:
      - oc-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8222/varz || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 2s

  # =========================================================================
  # 4. OpenConnect Sample Host / Gateway API
  # =========================================================================
  gateway-host:
    build:
      context: .
      dockerfile: samples/workers/shared/OpenConnect.Samples.Workers.Host/Dockerfile
    image: vuminkosimatibe/openconnect-sample-host:${OC_IMAGE_TAG:-e2e-local}
    container_name: oc-gateway-host
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      OC_TEST_MODE: "true"
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-openconnect};Username=${POSTGRES_USER:-openconnect};Password=${POSTGRES_PASSWORD:-openconnect_dev_password}"
      Nats__Url: ${NATS_URL:-nats://nats:4222}
      Workers__Security__Endpoint: http://worker-security:8080
      Workers__Inference__Endpoint: http://worker-inference:8080
      Workers__Transcription__Endpoint: http://worker-transcription:8080
      Workers__Kokoro__Endpoint: http://worker-kokoro:8080
      Workers__Playwright__Endpoint: http://worker-playwright:8080
      OPENCONNECT_SCAN_TOKEN: ${OPENCONNECT_SCAN_TOKEN:-e2e-test-token-do-not-use-in-prod}
      OpenConnect__LiveUI__Inference__Worker__Endpoint: ${LIVEUI_WORKER_ENDPOINT:-http://liveui-inference:8080}
      OpenConnect__LiveUI__Inference__Worker__Token: ${LIVEUI_WORKER_TOKEN:-}
      # Forward cloud model settings to gateway
      OpenConnect__ApiKey: ${OpenConnect__ApiKey:-}
      OpenConnect__ApiUrl: ${OpenConnect__ApiUrl:-}
      OpenConnect__ReasoningModel: ${OpenConnect__ReasoningModel:-}
      OpenConnect__ReasoningBackend: ${OpenConnect__ReasoningBackend:-}
      OpenConnect__Reasoning__Serverless__Endpoint: ${OpenConnect__Reasoning__Serverless__Endpoint:-}
      OpenConnect__Reasoning__Serverless__Model: ${OpenConnect__Reasoning__Serverless__Model:-}
      OpenConnect__Reasoning__Serverless__ApiKey: ${OpenConnect__Reasoning__Serverless__ApiKey:-}
      OpenConnect__MetaApiKey: ${OpenConnect__MetaApiKey:-}
      OpenConnect__MetaApiUrl: ${OpenConnect__MetaApiUrl:-}
      OpenConnect__MetaModel: ${OpenConnect__MetaModel:-}
      OpenConnect__ClaudeApiKey: ${OpenConnect__ClaudeApiKey:-}
      OpenConnect__ClaudeApiUrl: ${OpenConnect__ClaudeApiUrl:-}
      OpenConnect__ClaudeModel: ${OpenConnect__ClaudeModel:-}
      TODO_SERVICE_URL: http://todo-web-app:5000
      OPENCONNECT_WORKER_TOKEN: ${OPENCONNECT_WORKER_TOKEN:-e2e-worker-token-do-not-use-in-prod}
      TODO_INTERNAL_TOKEN: ${TODO_INTERNAL_TOKEN:-e2e-todo-internal-do-not-use-in-prod}
      TODO_INTERNAL_TENANT: ${TODO_INTERNAL_TENANT:-01ARZ3NDEKTSV4RRFFQ69G5FAV}
      TODO_ALLOW_MUTATIONS: ${TODO_ALLOW_MUTATIONS:-true}
      TODO_MUTATION_APPROVAL: ${TODO_MUTATION_APPROVAL:-approved}
    networks:
      - oc-network
    group_add: ["10001"]
    volumes:
      - oc_document_api_socket:/run/openconnect-document:ro
      - oc_vision_api_socket:/run/openconnect-vision:ro
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy

  # =========================================================================
  # 5. Core OpenConnect Workers
  # =========================================================================
  worker-security:
    build:
      context: workers/security
      dockerfile: Dockerfile
    image: vuminkosimatibe/openconnect-worker-security:${OC_IMAGE_TAG:-e2e-local}
    container_name: oc-worker-security
    restart: unless-stopped
    environment:
      OC_WORKER_ENGINE: ${OC_WORKER_ENGINE:-real}
      OC_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      OC_MODEL_DEVICE: auto
      OC_MODEL_PROVISIONING: ${OC_MODEL_PROVISIONING:-verify-existing-only}
      OC_MODEL_CACHE_DIR: /models
      OC_MODEL_OFFLINE: ${OC_MODEL_OFFLINE:-true}
      OC_SECURITY_RULES_ENABLED: "true"
      OPENCONNECT_SCAN_TOKEN: ${OPENCONNECT_SCAN_TOKEN:-e2e-test-token-do-not-use-in-prod}
    volumes:
      - oc_security_models:/models
    networks:
      - oc-network

  worker-inference-model-init:
    profiles: ["extraction"]
    build:
      context: .
      dockerfile: workers/inference/Dockerfile
    image: vuminkosimatibe/openconnect-worker-inference:${OC_IMAGE_TAG:-e2e-local}
    command: ["python", "-m", "openconnect_worker_common.models.initialize"]
    environment:
      OC_MODEL_MANIFEST_PATH: /config/init.json
      OC_MODEL_CACHE_DIR: /models
      OC_MODEL_PROVISIONING: ${OC_MODEL_PROVISIONING:-verify-existing-only}
      OC_MODEL_OFFLINE: ${OC_MODEL_OFFLINE:-true}
    volumes:
      - oc_inference_models:/models
      - ${OC_EXTRACTION_INIT_CONFIG:-./workers/inference/config/unconfigured.json}:/config/init.json:ro
    networks: [oc-network]

  worker-inference:
    build:
      context: .
      dockerfile: workers/inference/Dockerfile
    image: vuminkosimatibe/openconnect-worker-inference:${OC_IMAGE_TAG:-e2e-local}
    container_name: oc-worker-inference
    restart: unless-stopped
    environment:
      OPENCONNECT_INFERENCE_TOKEN: ${OPENCONNECT_INFERENCE_TOKEN:-${OPENCONNECT_WORKER_TOKEN:-}}
      OPENCONNECT_WORKER_SIGNING_KEY: ${OPENCONNECT_WORKER_SIGNING_KEY:-}
      OC_EXTRACTION_ENABLED: ${OC_EXTRACTION_ENABLED:-false}
      OC_EXTRACTION_CONFIG_PATH: /config/extraction.json
      OC_WORKER_ENGINE: ${OC_WORKER_ENGINE:-real}
      OC_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      OC_MODEL_DEVICE: auto
      OC_MODEL_PROVISIONING: ${OC_MODEL_PROVISIONING:-verify-existing-only}
      OC_MODEL_CACHE_DIR: /models
      # Forward Cloud Inference credentials from .env to the Python inference worker
      OC_INFERENCE_PROVIDER: ${OpenConnect__ReasoningBackend:-meta-model-api}
      OC_INFERENCE_MODEL: ${OpenConnect__ReasoningModel:-${OpenConnect__MetaModel:-muse-spark-1.3-contributor}}
      OC_INFERENCE_API_BASE_URL: ${OpenConnect__ApiUrl:-${OpenConnect__MetaApiUrl:-https://api.meta.ai/v1}}
      INFERENCE_CLOUD_API_KEY: ${OpenConnect__ApiKey:-${OpenConnect__MetaApiKey:-${OpenConnect__ClaudeApiKey:-}}}
      OC_CONTRIBUTOR_DATA_USE_APPROVED: ${OC_CONTRIBUTOR_DATA_USE_APPROVED:-0}
    volumes:
      - oc_inference_models:/models:ro
      - ${OC_EXTRACTION_SERVE_CONFIG:-./workers/inference/config/unconfigured.json}:/config/extraction.json:ro
    depends_on:
      worker-inference-model-init:
        condition: service_completed_successfully
        required: false
    networks:
      - oc-network

  liveui-inference:
    build:
      context: ./workers/liveui-inference
      dockerfile: Dockerfile
    image: vuminkosimatibe/openconnect-worker-liveui-inference:${OC_IMAGE_TAG:-e2e-local}
    container_name: oc-worker-liveui-inference
    environment:
      MODEL_ENABLED: "true"
      LIVEUI_ALLOW_MODEL_DOWNLOAD: ${LIVEUI_ALLOW_MODEL_DOWNLOAD:-false}
      MODEL_ID: ${LIVEUI_MODEL_ID:-bartowski/Qwen_Qwen3-0.6B-GGUF}
      MODEL_REVISION: ${LIVEUI_MODEL_REVISION:-60b85c0e3d8fe0f6474f406922a26d12aca4550d}
      MODEL_FILENAME: ${LIVEUI_MODEL_FILENAME:-Qwen_Qwen3-0.6B-Q4_K_M.gguf}
      MODEL_SHA256: ${LIVEUI_MODEL_SHA256:-9acfc1e001311f34b4252001b626f2e466d592a42065f66571bff3790d4e1b14}
      MODEL_PATH: /models/liveui.gguf
      MODEL_CONTEXT_SIZE: ${LIVEUI_MODEL_CONTEXT_SIZE:-2048}
      MODEL_THREADS: ${LIVEUI_MODEL_THREADS:-4}
      MAX_CONCURRENT_INFERENCES: ${LIVEUI_MAX_CONCURRENT_INFERENCES:-1}
      QUEUE_CAPACITY: ${LIVEUI_QUEUE_CAPACITY:-4}
      REQUEST_TIMEOUT_SECONDS: ${LIVEUI_REQUEST_TIMEOUT_SECONDS:-30}
      OPENCONNECT_WORKER_TOKEN: ${LIVEUI_WORKER_TOKEN:-}
    volumes:
      - oc_liveui_models:/models
    cpus: 4
    mem_limit: 2g
    restart: unless-stopped
    networks:
      - oc-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 600s

  worker-transcription:
    profiles: ["transcription"]
    build:
      context: workers/transcription
      dockerfile: Dockerfile
    image: vuminkosimatibe/openconnect-worker-transcription:${OC_IMAGE_TAG:-e2e-local}
    container_name: oc-worker-transcription
    environment:
      OC_WORKER_ENGINE: ${OC_WORKER_ENGINE:-real}
      OC_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      OC_MODEL_DEVICE: auto
      OC_MODEL_PROVISIONING: ${OC_MODEL_PROVISIONING:-verify-existing-only}
      OC_MODEL_CACHE_DIR: /models
      TRANSCRIPTION_BACKEND: ${TRANSCRIPTION_BACKEND:-local-fake}
      TRANSCRIPTION_MODEL_REVISION: ${TRANSCRIPTION_MODEL_REVISION:-}
      TRANSCRIPTION_MAX_AUDIO_BYTES: ${TRANSCRIPTION_MAX_AUDIO_BYTES:-5242880}
      TRANSCRIPTION_MAX_DURATION_MS: ${TRANSCRIPTION_MAX_DURATION_MS:-60000}
      # Forward Cloud STT credentials from .env
      OC_TRANSCRIPTION_PROVIDER: ${OpenConnect__TranscriptionModel:-meta-model-api}
      OC_TRANSCRIPTION_MODEL: ${OC_TRANSCRIPTION_MODEL:-${OpenConnect__ASR_MODEL:-${OpenConnect__TranscriptionModel:-}}}
      OC_TRANSCRIPTION_MODE: ${OpenConnect__ASRMode:-ENDPOINTING}
      TRANSCRIPTION_DEFAULT_LOCALE: ${OpenConnect__Asr__Language:-en}
      OC_TRANSCRIPTION_FILE_URL: ${OC_TRANSCRIPTION_FILE_URL-${OpenConnect__ASR_Transcription__URL:-${OpenConnect__TranscriptionApiUrl:-https://api.meta.ai/v1/asr/transcribe}}}
      OC_TRANSCRIPTION_REALTIME_URL: ${OpenConnect__ASR_WSS:-wss://api.meta.ai/v1/asr/realtime}
      TRANSCRIPTION_CLOUD_API_KEY: ${OpenConnect__ApiKey:-${OpenConnect__MetaApiKey:-}}
      OPENCONNECT_WORKER_TOKEN: ${OPENCONNECT_WORKER_TOKEN:-e2e-worker-token-do-not-use-in-prod}
    volumes:
      - oc_transcription_models:/models
    networks:
      - oc-network

  worker-kokoro:
    build:
      context: workers/kokoro
      dockerfile: Dockerfile
    image: vuminkosimatibe/openconnect-worker-kokoro:${OC_IMAGE_TAG:-e2e-local}
    container_name: oc-worker-kokoro
    restart: unless-stopped
    environment:
      OC_MODEL_CACHE_DIR: /models
      OC_KOKORO_ALLOW_DOWNLOAD: ${OC_KOKORO_ALLOW_DOWNLOAD:-false}
      OC_KOKORO_MODEL: hexgrad/Kokoro-82M
      OC_KOKORO_VOICE: af_heart
      KOKORO_VOICES: af_heart
      OPENCONNECT_WORKER_TOKEN: ${OPENCONNECT_WORKER_TOKEN:?set a worker token}
      OPENCONNECT_CLOUD_CONSUMPTION_ENABLED: ${OC_KOKORO_CLOUD_CONSUMPTION_ENABLED:-false}
      OPENCONNECT_CLOUD_DEPLOYMENT_ID: ${OC_KOKORO_CLOUD_DEPLOYMENT_ID:-}
      OPENCONNECT_CLOUD_AUTHORITY_ORIGIN: ${OC_KOKORO_CLOUD_AUTHORITY_ORIGIN:-}
      OPENCONNECT_CLOUD_AUTHORITY_CA_FILE: ${OC_KOKORO_CLOUD_AUTHORITY_CA_FILE:-}
      OPENCONNECT_CLOUD_WORKER_CERT_FILE: ${OC_KOKORO_CLOUD_WORKER_CERT_FILE:-}
      OPENCONNECT_CLOUD_WORKER_KEY_FILE: ${OC_KOKORO_CLOUD_WORKER_KEY_FILE:-}
    volumes:
      - oc_kokoro_models:/models
    networks:
      - oc-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready')"]
      interval: 10s
      timeout: 30s
      retries: 10
      start_period: 120s

  worker-playwright:
    profiles: ["navigator"]
    build:
      context: workers/navigator-playwright
      dockerfile: Dockerfile
    image: vuminkosimatibe/openconnect-worker-navigator-playwright:${OC_IMAGE_TAG:-e2e-local}
    container_name: oc-worker-playwright
    environment:
      PORT: "8080"
      NAVIGATOR_WORKER_TOKEN: ${NAVIGATOR_WORKER_TOKEN:-}
      NAVIGATOR_ALLOWED_ORIGINS: ${NAVIGATOR_ALLOWED_ORIGINS:-https://example.com}
      PLAYWRIGHT_LAUNCH: "1"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp/nav-tmp:noexec,nosuid,size=512m
    networks:
      - oc-network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  worker-outbox:
    profiles: ["operational"]
    build:
      context: .
      dockerfile: src/OpenConnect.WorkerHosts.Outbox/Dockerfile
    image: vuminkosimatibe/openconnect-worker-outbox:${OC_IMAGE_TAG:-e2e-local}
    container_name: oc-worker-outbox
    environment:
      WorkerHosts__Outbox__Mode: Standalone
      WorkerHosts__Outbox__EmbeddedDispatcherEnabled: "false"
      WorkerHosts__Outbox__TenantUlid: "01ARZ3NDEKTSV4RRFFQ69G5FAV"
      WorkerHosts__Outbox__DatabaseProvider: npgsql
      WorkerHosts__Outbox__ConnectionString: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-openconnect};Username=${POSTGRES_USER:-openconnect};Password=${POSTGRES_PASSWORD:-openconnect_dev_password}"
      WorkerHosts__Outbox__NatsUrl: nats://nats:4222
    networks:
      - oc-network
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy

  worker-operational:
    profiles: ["operational"]
    build:
      context: .
      dockerfile: src/OpenConnect.WorkerHosts.Operational/Dockerfile
    image: vuminkosimatibe/openconnect-worker-operational-agents:${OC_IMAGE_TAG:-e2e-local}
    container_name: oc-worker-operational
    environment:
      WorkerHosts__Operational__Mode: Standalone
      WorkerHosts__Operational__EmbeddedEnabled: "false"
      WorkerHosts__Operational__TenantUlid: "01ARZ3NDEKTSV4RRFFQ69G5FAV"
      WorkerHosts__Operational__DatabaseProvider: npgsql
      WorkerHosts__Operational__ConnectionString: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-openconnect};Username=${POSTGRES_USER:-openconnect};Password=${POSTGRES_PASSWORD:-openconnect_dev_password}"
      WorkerHosts__Operational__NatsUrl: nats://nats:4222
    networks:
      - oc-network
    depends_on:
      postgres:
        condition: service_healthy

# =============================================================================
# Networks & Persistent Volumes
# =============================================================================
networks:
  oc-network:
    name: ${OC_NETWORK_NAME:-open-connect_oc-network}
    driver: bridge

volumes:
  oc_docs_keys:
  oc_docs_tls:
  oc_todo_app_data:
  oc_postgres_data:
  oc_security_models:
  oc_inference_models:
  oc_transcription_models:
  oc_kokoro_models:
  oc_liveui_models:
  oc_knowledge_models:
  oc_document_models:
  oc_document_api_socket:
  oc_clamav_database:
  oc_clamav_socket:
  oc_minio_data:
  oc_vision_models:
  oc_vision_api_socket:
  oc_classification_models:
    name: oc_classification_models
  oc_nllb_models:
    name: oc_nllb_models
  oc_mms_models:
    name: oc_mms_models
  oc_realtime_voice_models:
    name: oc_realtime_voice_models
