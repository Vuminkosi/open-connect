      CLOUD_INFERENCE_MODEL_ARTIFACT_REVIEWED: ${CLOUD_INFERENCE_MODEL_ARTIFACT_REVIEWED:-false}
      CLOUD_INFERENCE_MODEL_CONTEXT_TOKENS: ${CLOUD_INFERENCE_MODEL_CONTEXT_TOKENS:-4096}
      CLOUD_INFERENCE_MODEL_THREADS: ${CLOUD_INFERENCE_MODEL_THREADS:-2}
