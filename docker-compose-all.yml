      OpenConnect__Cloud__Identity__Google__ClientSecret: ${CLOUD_GOOGLE_CLIENT_SECRET:-}
      ConnectionStrings__CloudControlPlane: ${CLOUD_CONTROL_PLANE_CONNECTION:-}
    ports:
      - "127.0.0.1:${OPENCONNECT_DOCS_PORT:-5050}:8080"
    volumes:
