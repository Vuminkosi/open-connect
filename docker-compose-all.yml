    networks: [oc-network]

  classification-tls:
    profiles: ["classification-cloud"]
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    user: "101:101"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=8m"]
    command: ["nginx", "-c", "/etc/nginx/nginx.conf", "-g", "daemon off;"]
    depends_on:
      worker-classification:
        condition: service_started
    volumes:
      - ./cloud/classification-tls/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${CLOUD_CLASSIFICATION_TLS_SECRETS_DIR:-./cloud/classification-tls/secrets}:/run/classification-tls:ro
    networks: [oc-network]
    restart: unless-stopped

  nllb-model-init:
    profiles: ["nllb"]
    build:
