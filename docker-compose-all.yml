# Complete End-to-End Todo Sample Compose Stack
# Combines:
# 1. OpenConnect Blazor Web & Gateway Application (Port 5000)
# 2. Database (PostgreSQL 16)
# 3. Message Broker (NATS JetStream)
# 4. Canonical OpenConnect Worker Services (Security, Inference, Transcription, Kokoro, Playwright, Operational Agents, Outbox)
#
# Environment variables from .env in the root folder are automatically loaded and forwarded.

services:
  # =========================================================================
  # 1. OpenConnect Blazor Web UI & Interactive Gateway Application
  # =========================================================================
  todo-web-app:
    build:
      context: .
      dockerfile: samples/Blazor/Dockerfile
    image: vuminkosimatibe/openconnect-sample-todo:${OC_IMAGE_TAG:-e2e-local}
    container_name: oc-todo-web-app
    ports:
      - "5000:5000"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      OPENCONNECT_BLAZOR_SQLITE_PATH: /data/blazor-todo.db
      GATEWAY_URL: http://gateway-host:8080/
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-openconnect};Username=${POSTGRES_USER:-openconnect};Password=${POSTGRES_PASSWORD:-openconnect}"
      Nats__Url: ${NATS_URL:-nats://nats:4222}
      Workers__Security__Endpoint: http://worker-security:8080
      Workers__Inference__Endpoint: http://worker-inference:8080
      Workers__Transcription__Endpoint: http://worker-transcription:8080
      Workers__Kokoro__Endpoint: http://worker-kokoro:8080
      Workers__Playwright__Endpoint: http://worker-playwright:8080
      # Pass through Cloud Inference / Model configuration from .env
      OpenConnect__ApiKey: ${OpenConnect__ApiKey:-}
      OpenConnect__ApiUrl: ${OpenConnect__ApiUrl:-}
      OpenConnect__ReasoningModel: ${OpenConnect__ReasoningModel:-}
      OpenConnect__ReasoningBackend: ${OpenConnect__ReasoningBackend:-}
      OpenConnect__Reasoning__Serverless__Endpoint: ${OpenConnect__Reasoning__Serverless__Endpoint:-}
      OpenConnect__Reasoning__Serverless__Model: ${OpenConnect__Reasoning__Serverless__Model:-}
      OpenConnect__Reasoning__Serverless__ApiKey: ${OpenConnect__Reasoning__Serverless__ApiKey:-}
      OpenConnect__MetaApiKey: ${OpenConnect__MetaApiKey:-}
      OpenConnect__MetaApiUrl: ${OpenConnect__MetaApiUrl:-}
      OpenConnect__MetaModel: ${OpenConnect__MetaModel:-}
      OpenConnect__ClaudeApiKey: ${OpenConnect__ClaudeApiKey:-}
      OpenConnect__ClaudeApiUrl: ${OpenConnect__ClaudeApiUrl:-}
      OpenConnect__ClaudeModel: ${OpenConnect__ClaudeModel:-}
      # Cloud Speech / Transcription
      OpenConnect__ASR_MODEL: ${OpenConnect__ASR_MODEL:-}
      OpenConnect__ASR_WSS: ${OpenConnect__ASR_WSS:-}
      OpenConnect__ASR_Transcription__URL: ${OpenConnect__ASR_Transcription__URL:-}
      OpenConnect__TranscriptionModel: ${OpenConnect__TranscriptionModel:-}
      OpenConnect__TranscriptionApiUrl: ${OpenConnect__TranscriptionApiUrl:-}
      OPENCONNECT_TTS_INTERNAL_KEY: ${OPENCONNECT_TTS_INTERNAL_KEY:-}
      TODO_INTERNAL_TOKEN: ${TODO_INTERNAL_TOKEN:-e2e-todo-internal-do-not-use-in-prod}
      TODO_INTERNAL_TENANT: ${TODO_INTERNAL_TENANT:-01ARZ3NDEKTSV4RRFFQ69G5FAV}
    volumes:
      - oc_todo_app_data:/data
    networks:
      - oc-network
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy

  # =========================================================================
  # 2. Relational Database (PostgreSQL)
  # =========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: oc-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-openconnect}
      POSTGRES_USER: ${POSTGRES_USER:-openconnect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openconnect_dev_password}
    volumes:
      - oc_postgres_data:/var/lib/postgresql/data
    networks:
      - oc-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openconnect} -d ${POSTGRES_DB:-openconnect}"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 2s

  # =========================================================================
  # 3. Messaging Transport (NATS JetStream)
  # =========================================================================
  nats:
    image: nats:2.10-alpine
    container_name: oc-nats
    command: ["-js", "-m", "8222"]
    ports:
      - "${NATS_CLIENT_PORT:-4222}:4222"
      - "${NATS_MONITOR_PORT:-8222}:8222"
    environment:
      NATS_APP_USER: ${NATS_APP_USER:-}
      NATS_APP_PASSWORD: ${NATS_APP_PASSWORD:-}
    networks:
      - oc-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8222/varz || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 2s

  # =========================================================================
  # 4. OpenConnect Sample Host / Gateway API
  # =========================================================================
  gateway-host:
    build:
      context: .
      dockerfile: samples/workers/shared/OpenConnect.Samples.Workers.Host/Dockerfile
    image: vuminkosimatibe/openconnect-sample-host:${OC_IMAGE_TAG:-e2e-local}
    container_name: oc-gateway-host
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      OC_TEST_MODE: "true"
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-openconnect};Username=${POSTGRES_USER:-openconnect};Password=${POSTGRES_PASSWORD:-openconnect}"
      Nats__Url: ${NATS_URL:-nats://nats:4222}
      Workers__Security__Endpoint: http://worker-security:8080
      Workers__Inference__Endpoint: http://worker-inference:8080
      Workers__Transcription__Endpoint: http://worker-transcription:8080
      Workers__Kokoro__Endpoint: http://worker-kokoro:8080
      Workers__Playwright__Endpoint: http://worker-playwright:8080
      OPENCONNECT_SCAN_TOKEN: ${OPENCONNECT_SCAN_TOKEN:-e2e-test-token-do-not-use-in-prod}
      # Forward cloud model settings to gateway
      OpenConnect__ApiKey: ${OpenConnect__ApiKey:-}
      OpenConnect__ApiUrl: ${OpenConnect__ApiUrl:-}
      OpenConnect__ReasoningModel: ${OpenConnect__ReasoningModel:-}
      OpenConnect__ReasoningBackend: ${OpenConnect__ReasoningBackend:-}
      OpenConnect__Reasoning__Serverless__Endpoint: ${OpenConnect__Reasoning__Serverless__Endpoint:-}
      OpenConnect__Reasoning__Serverless__Model: ${OpenConnect__Reasoning__Serverless__Model:-}
      OpenConnect__Reasoning__Serverless__ApiKey: ${OpenConnect__Reasoning__Serverless__ApiKey:-}
      OpenConnect__MetaApiKey: ${OpenConnect__MetaApiKey:-}
      OpenConnect__MetaApiUrl: ${OpenConnect__MetaApiUrl:-}
      OpenConnect__MetaModel: ${OpenConnect__MetaModel:-}
      OpenConnect__ClaudeApiKey: ${OpenConnect__ClaudeApiKey:-}
      OpenConnect__ClaudeApiUrl: ${OpenConnect__ClaudeApiUrl:-}
      OpenConnect__ClaudeModel: ${OpenConnect__ClaudeModel:-}
      TODO_SERVICE_URL: http://todo-web-app:5000
      TODO_INTERNAL_TOKEN: ${TODO_INTERNAL_TOKEN:-e2e-todo-internal-do-not-use-in-prod}
      TODO_INTERNAL_TENANT: ${TODO_INTERNAL_TENANT:-01ARZ3NDEKTSV4RRFFQ69G5FAV}
      TODO_ALLOW_MUTATIONS: ${TODO_ALLOW_MUTATIONS:-true}
    networks:
      - oc-network
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy

  # =========================================================================
  # 5. Core OpenConnect Workers
  # =========================================================================
  worker-security:
    build:
      context: workers/security
      dockerfile: Dockerfile
    image: vuminkosimatibe/openconnect-worker-security:${OC_IMAGE_TAG:-e2e-local}
    container_name: oc-worker-security
    environment:
      OC_WORKER_ENGINE: ${OC_WORKER_ENGINE:-real}
      OC_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      OC_MODEL_DEVICE: auto
      OC_MODEL_PROVISIONING: first-start-if-missing
      OC_MODEL_CACHE_DIR: /models
      OC_MODEL_OFFLINE: "false"
      OC_SECURITY_RULES_ENABLED: "true"
      OPENCONNECT_SCAN_TOKEN: ${OPENCONNECT_SCAN_TOKEN:-e2e-test-token-do-not-use-in-prod}
    volumes:
      - oc_security_models:/models
    networks:
      - oc-network

  worker-inference:
    build:
      context: workers/inference
      dockerfile: Dockerfile
    image: vuminkosimatibe/openconnect-worker-inference:${OC_IMAGE_TAG:-e2e-local}
    container_name: oc-worker-inference
    environment:
      OC_WORKER_ENGINE: ${OC_WORKER_ENGINE:-real}
      OC_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      OC_MODEL_DEVICE: auto
      OC_MODEL_PROVISIONING: first-start-if-missing
      OC_MODEL_CACHE_DIR: /models
      # Forward Cloud Inference credentials from .env to the Python inference worker
      OC_INFERENCE_PROVIDER: ${OpenConnect__ReasoningBackend:-meta-model-api}
      OC_INFERENCE_MODEL: ${OpenConnect__ReasoningModel:-${OpenConnect__MetaModel:-muse-spark-1.3-contributor}}
      OC_INFERENCE_API_BASE_URL: ${OpenConnect__ApiUrl:-${OpenConnect__MetaApiUrl:-https://api.meta.ai/v1}}
      INFERENCE_CLOUD_API_KEY: ${OpenConnect__ApiKey:-${OpenConnect__MetaApiKey:-${OpenConnect__ClaudeApiKey:-}}}
      OC_CONTRIBUTOR_DATA_USE_APPROVED: "1"
    volumes:
      - oc_inference_models:/models
    networks:
      - oc-network

  worker-transcription:
    build:
      context: workers/transcription
      dockerfile: Dockerfile
    image: vuminkosimatibe/openconnect-worker-transcription:${OC_IMAGE_TAG:-e2e-local}
    container_name: oc-worker-transcription
    environment:
      OC_WORKER_ENGINE: ${OC_WORKER_ENGINE:-real}
      OC_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      OC_MODEL_DEVICE: auto
      OC_MODEL_PROVISIONING: first-start-if-missing
      OC_MODEL_CACHE_DIR: /models
      # Forward Cloud STT credentials from .env
      OC_TRANSCRIPTION_PROVIDER: ${OpenConnect__TranscriptionModel:-meta-model-api}
      OC_TRANSCRIPTION_MODEL: ${OpenConnect__ASR_MODEL:-${OpenConnect__TranscriptionModel:-}}
      OC_TRANSCRIPTION_FILE_URL: ${OpenConnect__ASR_Transcription__URL:-${OpenConnect__TranscriptionApiUrl:-https://api.meta.ai/v1/asr/transcribe}}
      OC_TRANSCRIPTION_REALTIME_URL: ${OpenConnect__ASR_WSS:-wss://api.meta.ai/v1/asr/realtime}
      TRANSCRIPTION_CLOUD_API_KEY: ${OpenConnect__ApiKey:-${OpenConnect__MetaApiKey:-}}
    volumes:
      - oc_transcription_models:/models
    networks:
      - oc-network

  worker-kokoro:
    build:
      context: workers/kokoro
      dockerfile: Dockerfile
    image: vuminkosimatibe/openconnect-worker-kokoro:${OC_IMAGE_TAG:-e2e-local}
    container_name: oc-worker-kokoro
    environment:
      OC_WORKER_ENGINE: ${OC_WORKER_ENGINE:-fake}
      OC_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      OC_MODEL_DEVICE: auto
      OC_MODEL_PROVISIONING: first-start-if-missing
      OC_MODEL_CACHE_DIR: /models
      OC_KOKORO_MODEL: hexgrad/Kokoro-82M
      OC_KOKORO_VOICE: af_heart
      OPENCONNECT_TTS_INTERNAL_KEY: ${OPENCONNECT_TTS_INTERNAL_KEY:-}
    volumes:
      - oc_kokoro_models:/models
    networks:
      - oc-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

  worker-playwright:
    build:
      context: workers/navigator-playwright
      dockerfile: Dockerfile
    image: vuminkosimatibe/openconnect-worker-navigator-playwright:${OC_IMAGE_TAG:-e2e-local}
    container_name: oc-worker-playwright
    networks:
      - oc-network

  worker-outbox:
    build:
      context: .
      dockerfile: src/OpenConnect.WorkerHosts.Outbox/Dockerfile
    image: vuminkosimatibe/openconnect-worker-outbox:${OC_IMAGE_TAG:-e2e-local}
    container_name: oc-worker-outbox
    environment:
      WorkerHosts__Outbox__Mode: Standalone
      WorkerHosts__Outbox__EmbeddedDispatcherEnabled: "false"
      WorkerHosts__Outbox__TenantUlid: "01ARZ3NDEKTSV4RRFFQ69G5FAV"
      WorkerHosts__Outbox__DatabaseProvider: npgsql
      WorkerHosts__Outbox__ConnectionString: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-openconnect};Username=${POSTGRES_USER:-openconnect};Password=${POSTGRES_PASSWORD:-openconnect}"
      WorkerHosts__Outbox__NatsUrl: nats://nats:4222
    networks:
      - oc-network
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy

  worker-operational:
    build:
      context: .
      dockerfile: src/OpenConnect.WorkerHosts.Operational/Dockerfile
    image: vuminkosimatibe/openconnect-worker-operational-agents:${OC_IMAGE_TAG:-e2e-local}
    container_name: oc-worker-operational
    environment:
      WorkerHosts__Operational__Mode: Standalone
      WorkerHosts__Operational__EmbeddedEnabled: "false"
      WorkerHosts__Operational__TenantUlid: "01ARZ3NDEKTSV4RRFFQ69G5FAV"
      WorkerHosts__Operational__DatabaseProvider: npgsql
      WorkerHosts__Operational__ConnectionString: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-openconnect};Username=${POSTGRES_USER:-openconnect};Password=${POSTGRES_PASSWORD:-openconnect}"
      WorkerHosts__Operational__NatsUrl: nats://nats:4222
    networks:
      - oc-network
    depends_on:
      postgres:
        condition: service_healthy

# =============================================================================
# Networks & Persistent Volumes
# =============================================================================
networks:
  oc-network:
    name: open-connect_oc-network
    driver: bridge

volumes:
  oc_todo_app_data:
  oc_postgres_data:
  oc_security_models:
  oc_inference_models:
  oc_transcription_models:
  oc_kokoro_models:
