      CLOUD_INFERENCE_DEPLOYMENT_ID: ${CLOUD_INFERENCE_DEPLOYMENT_ID:-}
      CLOUD_INFERENCE_ENDPOINT_REFERENCE: ${CLOUD_INFERENCE_ENDPOINT_REFERENCE:-}
      CLOUD_INFERENCE_REGION: ${CLOUD_INFERENCE_REGION:-}
      CLOUD_INFERENCE_CONTRACT_VERSION: ${CLOUD_INFERENCE_CONTRACT_VERSION:-}
      CLOUD_INFERENCE_MODEL_PATH: ${CLOUD_INFERENCE_MODEL_PATH:-}
      CLOUD_INFERENCE_MODEL_ID: ${CLOUD_INFERENCE_MODEL_ID:-}
      CLOUD_INFERENCE_MODEL_REVISION: ${CLOUD_INFERENCE_MODEL_REVISION:-}
      CLOUD_INFERENCE_MODEL_DIGEST: ${CLOUD_INFERENCE_MODEL_DIGEST:-}
      CLOUD_INFERENCE_MODEL_FORMAT: ${CLOUD_INFERENCE_MODEL_FORMAT:-}
