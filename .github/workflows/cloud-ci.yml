name: Cloud CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: cloud-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cloud-gateway-tests:
    name: Cloud Gateway (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'

      - name: Run Cloud gateway tests
        run: node --test cloud/gateway/*.test.mjs

  cloud-contracts-and-docs-tests:
    name: Cloud Contracts & Docs Tests (.NET)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            global.json
            Directory.Packages.props
            Directory.Build.props
            site/OpenConnect.Docs.Tests/packages.lock.json

      - name: Validate OpenAPI and JSON Schema contracts
        shell: pwsh
        run: ./scripts/validate-docs-contracts.ps1

      - name: Validate documentation content
        shell: pwsh
        run: ./scripts/validate-docs-content.ps1

      - name: Restore docs test project (locked mode)
        run: dotnet restore site/OpenConnect.Docs.Tests/OpenConnect.Docs.Tests.csproj --locked-mode

      - name: Build docs test project (Release, warnings as errors)
        run: dotnet build site/OpenConnect.Docs.Tests/OpenConnect.Docs.Tests.csproj -c Release --no-restore -warnaserror

      - name: Run docs tests
        run: dotnet test site/OpenConnect.Docs.Tests/OpenConnect.Docs.Tests.csproj -c Release --no-build --filter "Category!=NatsLive"
