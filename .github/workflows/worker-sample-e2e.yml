name: Worker Sample E2E

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      tier:
        description: Selected tier (static, contract, image-startup, integration, model-live, offline-revision, release)
        required: false
        default: contract
        type: string
      provider:
        description: Selected relational provider (sqlite, postgres, sqlserver)
        required: false
        default: sqlite
        type: string

permissions:
  contents: read

concurrency:
  group: worker-sample-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  samples-workers-static-and-contract:
    name: Static Policy, Shared Harness & Contract (${{ matrix.worker }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        worker:
          - security
          - classification
          - nllb
          - inference
          - transcription
          - realtime-voice
          - kokoro
          - mms-tts
          - navigator-playwright
          - operational-agents
          - outbox
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Static and image build policy check (no build-time model downloads)
        run: ./samples/workers/shared/scripts/verify-no-build-models.sh "${{ matrix.worker }}"

      - name: Execute worker sample contract tier
        run: ./samples/workers/shared/scripts/run-one.sh "${{ matrix.worker }}" --tier contract --provider sqlite

  samples-shared-testkit:
    name: Shared Harness & Provider Persistence TestKit (.NET 10)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v4.3.1
        with:
          global-json-file: global.json

      - name: Build and test Shared Worker E2E TestKit & Persistence Providers
        run: |
          dotnet build samples/workers/shared/OpenConnect.Samples.Workers.TestKit/OpenConnect.Samples.Workers.TestKit.csproj -c Release -warnaserror
          dotnet test samples/workers/shared/OpenConnect.Samples.Workers.TestKit/OpenConnect.Samples.Workers.TestKit.csproj -c Release --no-build

      - name: Collect sanitized evidence bundle
        run: ./samples/workers/shared/scripts/collect-evidence.sh --run-id "ci-${{ github.run_id }}" --tier contract --provider sqlite

  samples-ef-providers:
    name: Operational & Outbox EF Provider Matrix (${{ matrix.provider }})
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        worker: [operational-agents, outbox]
        provider: [sqlite, postgres, sqlserver]
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run sample for provider
        run: ./samples/workers/shared/scripts/run-one.sh "${{ matrix.worker }}" --tier "${{ inputs.tier || 'contract' }}" --provider "${{ matrix.provider }}"

  samples-workers-model-live:
    name: Scheduled/Manual Model-Live & Offline-Revision Gate
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && (inputs.tier == 'model-live' || inputs.tier == 'offline-revision')
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify approved model manifest gate
        run: ./samples/workers/shared/scripts/verify-no-build-models.sh
