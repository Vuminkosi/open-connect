name: Documentation Portal

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  portal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v4.3.1
        with:
          dotnet-version-file: global.json
          cache: true
          cache-dependency-path: |
            global.json
            Directory.Packages.props
            Directory.Build.props
            site/OpenConnect.Docs/packages.lock.json
      - name: Restore solution and portal
        run: |
          dotnet restore OpenConnect.slnx --locked-mode
          dotnet restore site/OpenConnect.Docs/OpenConnect.Docs.csproj --locked-mode
      - name: Build solution serially
        run: dotnet build OpenConnect.slnx -c Release --no-restore -warnaserror -m:1
      - name: Generate DocFX and contract artifacts
        shell: pwsh
        run: ./scripts/generate-docs-api.ps1 -Mode all
      - name: Build portal
        run: dotnet build site/OpenConnect.Docs/OpenConnect.Docs.csproj -c Release --no-restore -warnaserror
      - name: Validate content files
        shell: pwsh
        run: ./scripts/validate-docs-content.ps1
      - name: Validate OpenAPI and JSON Schema contracts
        shell: pwsh
        run: ./scripts/validate-docs-contracts.ps1
      - name: Check source tree for secrets in portal assets
        shell: pwsh
        run: |
          $hits = Get-ChildItem site/OpenConnect.Docs -Recurse -File | Select-String -Pattern 'sk-[A-Za-z0-9]{16,}|BEGIN .*PRIVATE KEY|OPENCONNECT_SCAN_TOKEN=' -AllMatches
          if ($hits) { $hits | Format-List; throw 'Secret-like value found in portal assets.' }
      - name: Portal component tests
        run: dotnet test site/OpenConnect.Docs.Tests/OpenConnect.Docs.Tests.csproj -c Release --no-restore
      - name: Todo source regression build
        run: dotnet build samples/Blazor/OpenConnect.Samples.Blazor.csproj -c Release --no-restore -warnaserror

  published-consumers:
    name: Published NuGet consumers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v4.3.1
        with:
          dotnet-version-file: global.json
      - name: Verify clean NuGet consumers
        shell: pwsh
        run: ./scripts/verify-published-consumers.ps1
      - name: Print consumer evidence
        shell: pwsh
        run: Get-ChildItem build/evidence/published-consumers -File | ForEach-Object { Write-Host $_.Name; Get-Content $_.FullName }

  snippets:
    name: Published documentation snippets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v4.3.1
        with:
          dotnet-version-file: global.json
      - name: Compile runnable C# snippets
        shell: pwsh
        run: ./scripts/verify-doc-snippets.ps1
