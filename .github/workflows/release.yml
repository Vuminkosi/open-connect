# Release — NuGet OIDC trusted publishing (Gate 6).
#
# Owner/repo: Vuminkosi/open-connect. Package pattern: OpenConnect.*.
# Auth model: GitHub OIDC -> nuget.org short-lived API key via NuGet/login.
# NO long-lived API keys anywhere. No `dotnet nuget push` executes unless the
# workflow was explicitly armed for publishing (see `publish` input below).
#
# Version rule (automated versioning, no manual Version edits):
#   - Tag push refs/tags/vX.Y.Z (e.g. v1.1.0) -> pack/push that X.Y.Z.
#     Tag MUST be valid SemVer after stripping the leading `v` or the run
#     fails. Duplicate versions can never silently overwrite: the push step
#     keeps --skip-duplicate so republishes are skipped, not overwritten.
#   - Manual dispatch publish=true REQUIRES an explicit version: either run
#     from a v* tag or pass `version` input (validated SemVer). Without an
#     explicit version the run fails before packing (no draft is ever pushed).
#   - Dry-run (publish != true, the default) with no tag and no `version`
#     input uses draft 1.0.0-ci.<run_number>; it is packed/verified/attested
#     only and never pushed.
# Gate 7 (maintainer approval) is HARD_BLOCKED until a maintainer says go:
#   1. The `production` environment MUST have required reviewers configured in
#      the GitHub UI (Settings > Environments > production). Repo code cannot
#      create that protection; this workflow only *references* it.
#   2. Publishing additionally requires inputs.publish == true on a manual
#      dispatch. Tag pushes (v*) always take the dry-run path: pack, verify,
#      attest, list — never push.
#
# Required `production` environment configuration (names only, no values):
#   - Secret  NUGET_USER : nuget.org username of the TRUSTED PUBLISHING POLICY
#                          CREATOR (must be the user that created the trusted
#                          publishing policy on nuget.org, not the org owner).
#   - Protection: required reviewers (maintainer approval) + optional
#                 deployment-branch/tag policy limiting runs to v* tags.
#   - nuget.org side: trusted publishing policy for owner Vuminkosi, repo
#                     Vuminkosi/open-connect, workflow release.yml,
#                     environment production, package pattern OpenConnect.*.
name: Release (NuGet OIDC)

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to nuget.org (false = dry-run: pack, verify, attest only)'
        required: false
        default: false
        type: boolean
      version:
        description: 'Explicit package version (SemVer, e.g. 1.2.0). Empty = derive from v* tag or use ci draft.'
        required: false
        default: ''
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Pack, attest, publish (OIDC, dry-run by default)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v4.3.1
        with:
          dotnet-version: 10.0.403

      - name: Restore locked dependencies
        run: dotnet restore OpenConnect.slnx --locked-mode

      - name: Resolve package version
        id: resolve-version
        shell: pwsh
        run: |
          $semver = '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$'
          $ref = '${{ github.ref }}'
          $inputVersion = '${{ inputs.version }}'.Trim()
          $wantsPublish = '${{ inputs.publish }}' -eq 'true'
          $version = ''
          $source = ''
          if ($ref -like 'refs/tags/v*') {
            $version = $ref.Substring('refs/tags/v'.Length).Trim()
            $source = "tag $ref"
            if (-not ($version -match $semver)) { Write-Error "Tag version '$version' from $ref is not valid SemVer."; exit 1 }
          } elseif ($inputVersion -ne '') {
            $version = $inputVersion
            $source = 'workflow_dispatch inputs.version'
            if (-not ($version -match $semver)) { Write-Error "Input version '$version' is not valid SemVer."; exit 1 }
          } else {
            if ($wantsPublish) { Write-Error 'publish=true requires an explicit version: run from a v* tag or pass the `version` input.'; exit 1 }
            $version = '1.0.0-ci.${{ github.run_number }}'
            $source = 'dry-run draft'
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "PKG_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Resolved package version $version (source: $source)."

      - name: Pack Release (OpenConnect.* only)
        env:
          PKG_VERSION: ${{ steps.resolve-version.outputs.version }}
        run: dotnet pack OpenConnect.slnx -c Release --no-restore -warnaserror -o ./artifacts/packages /p:ContinuousIntegrationBuild=true /p:Version=$PKG_VERSION

      - name: Verify package file names match OpenConnect.*
        shell: pwsh
        run: |
          $pkgs = Get-ChildItem ./artifacts/packages -Filter *.nupkg -ErrorAction SilentlyContinue
          if (-not $pkgs) { Write-Error 'No .nupkg files were produced by dotnet pack.'; exit 1 }
          $bad = $pkgs | Where-Object { $_.Name -notlike 'OpenConnect.*.nupkg' }
          if ($bad) { Write-Error ("Packages outside the OpenConnect.* pattern: " + (($bad | ForEach-Object { $_.Name }) -join ', ')); exit 1 }
          $pkgs | ForEach-Object { Write-Host ("PACKED: " + $_.Name) }

      # Optional SBOM: runs only when scripts/generate-sbom.py exists.
      # Absence is informational (exit 0), never a failure.
      - name: Generate SBOM (optional, if script exists)
        shell: pwsh
        run: |
          if (Test-Path scripts/generate-sbom.py) { python scripts/generate-sbom.py }
          else { Write-Host 'SBOM script scripts/generate-sbom.py not present; skipping (informational).' }

      # Optional NuGet dependency-group audit: same existence guard.
      - name: Verify NuGet dependency groups (optional, if script exists)
        shell: pwsh
        run: |
          if (Test-Path scripts/verify-nuget-dependency-groups.py) { python scripts/verify-nuget-dependency-groups.py }
          else { Write-Host 'Audit script scripts/verify-nuget-dependency-groups.py not present; skipping (informational).' }

      - name: Attest build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: 'artifacts/packages/*'

      # OIDC exchange ONLY. Exchanges the job OIDC token for a short-lived
      # nuget.org API key. The key is masked and lives only in this job.
      # `user` is the policy-creator username from the production secret
      # NUGET_USER (name only; value never appears in repo code or logs).
      - name: NuGet login (OIDC trusted publishing)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Dry-run summary (no push)
        if: ${{ inputs.publish != true }}
        shell: pwsh
        run: |
          Write-Host 'DRY-RUN: pack + verify + attest completed. No push executed (inputs.publish != true).'
          Write-Host ('DRY-RUN VERSION: ' + '${{ steps.resolve-version.outputs.version }}' + ' (draft unless derived from a v* tag or `version` input; never pushed).')
          Get-ChildItem ./artifacts/packages -Filter OpenConnect.*.nupkg | ForEach-Object { Write-Host ("READY (not pushed): " + $_.Name) }

      # Gate 7 arm: manual dispatch with publish=true AND production
      # environment approval. --skip-duplicate keeps reruns idempotent.
      # Tag pushes can never reach this step (inputs.publish is undefined
      # on tag events, so the condition is false).
      - name: Push to nuget.org (armed publishes only)
        if: ${{ inputs.publish == true }}
        run: dotnet nuget push "./artifacts/packages/OpenConnect.*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
