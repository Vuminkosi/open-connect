name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (.NET 8 targets · SDK 9)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v4.3.1
        with:
          dotnet-version: 9.0.320

      - name: Restore locked dependencies
        run: dotnet restore OpenConnect.slnx --locked-mode

      - name: Build Release
        run: dotnet build OpenConnect.slnx -c Release --no-restore -warnaserror

      # Required legs exclude live-broker tests by default (S08): unit/fake
      # tests gate; live NATS never gates. Opt-in locally/adhoc with:
      #   $env:OPENCONNECT_TEST_NATS_URL='nats://localhost:4222'; dotnet test --filter "Category=NatsLive"
      # Disposable broker: docker run --rm -p 4222:4222 nats -js
      - name: Run tests
        run: dotnet test OpenConnect.slnx -c Release --no-build --filter "Category!=NatsLive"

      - name: Verify formatting
        run: dotnet format OpenConnect.slnx --verify-no-changes --no-restore

      - name: Check vulnerable dependencies
        shell: pwsh
        run: ./scripts/verify.ps1 -Security

      # Contract parity becomes executable when the contract test project lands.
      - name: Contract parity (pending contract test project)
        shell: pwsh
        run: ./scripts/verify.ps1 -ContractParity

  # EXPERIMENTAL-OBSERVATIONAL ONLY (orchestrator D-01): SDK 10 builds the
  # unchanged net8 TFMs. Informational; never required, never gates.
  # Zero TFM changes, zero version bumps (D-01/D-02).
  verify-sdk10-adversity:
    name: Verify SDK 10 builds net8 (experimental-observational)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET SDK 10
        uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v4.3.1
        with:
          dotnet-version: 10.0.403

      - name: Restore locked dependencies
        run: dotnet restore OpenConnect.slnx --locked-mode

      - name: Build Release
        run: dotnet build OpenConnect.slnx -c Release --no-restore -warnaserror

      # Full suite. Container-gated tests self-skip without Docker (D-03:
      # no image pulls, no live containers, no Testcontainers execution in CI).
      # Required legs exclude live-broker tests by default (S08): unit/fake
      # tests gate; live NATS never gates. Opt-in locally/adhoc with:
      #   $env:OPENCONNECT_TEST_NATS_URL='nats://localhost:4222'; dotnet test --filter "Category=NatsLive"
      # Disposable broker: docker run --rm -p 4222:4222 nats -js
      - name: Run tests
        run: dotnet test OpenConnect.slnx -c Release --no-build --filter "Category!=NatsLive"

  # Per-sample E2E matrix, windows-latest ONLY (orchestrator D-06 hardcodes
  # powershell.exe). Informational; never required, never gates.
  # D-03/D-04/D-05: no image pulls, no live containers, no test secrets, no
  # fixture provisioning. E2E-13 (PostgreSql) takes its exit-3 NOT VERIFIED
  # path; E2E-14 (SqlServer) exits 3 by design (no invocation, no pull).
  e2e-per-sample:
    name: E2E per-sample (${{ matrix.case }})
    runs-on: windows-latest
    timeout-minutes: 25
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        case: [Minimal, Sqlite, InMemory, Blazor, Navigator, PostgreSql, SqlServer]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v4.3.1
        with:
          dotnet-version: 9.0.320

      # D-04: PG-related env vars are ABSENT. This guard fails the step (not
      # the branch) if a fixture-like variable ever appears, so the
      # PostgreSql leg deterministically takes its exit-3 NOT VERIFIED path.
      - name: Assert no PG fixture env (PostgreSql leg must exit 3 NOT VERIFIED)
        if: matrix.case == 'PostgreSql'
        shell: powershell
        run: |
          $leaked = @('OPENCONNECT_E2E_POSTGRES_HOST', 'OPENCONNECT_POSTGRESQL_CONNECTION') | Where-Object { -not [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) }
          if ($leaked) { Write-Error ("PG fixture env must be absent in CI; found: " + ($leaked -join ', ')); exit 1 }
          Write-Host 'PG fixture env absent: OPENCONNECT_E2E_POSTGRES_HOST and OPENCONNECT_POSTGRESQL_CONNECTION are unset.'

      - name: Run E2E case ${{ matrix.case }}
        shell: powershell
        run: |
          $case = "${{ matrix.case }}"
          $work = Join-Path $env:TEMP ("e2e-" + $case.ToLowerInvariant())
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          $logDir = Join-Path $work 'logs'
          New-Item -ItemType Directory -Force -Path $logDir | Out-Null
          $dbFile = Join-Path $work ($case.ToLowerInvariant() + '.db')
          & (Join-Path 'samples/EndToEnd/cases' ("Run-" + $case + ".ps1")) -RepoRoot . -DbFile $dbFile -LogDir $logDir
          exit $LASTEXITCODE
