name: CI

on:
  workflow_dispatch:
    inputs:
      live_provider:
        description: 'Run against a configured DISPOSABLE database (applies sample migrations; never production)'
        type: choice
        default: none
        options: [none, PostgreSql, SqlServer]
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (.NET 8 targets · SDK 9)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          dotnet-version: 9.0.320

      - name: Restore locked dependencies
        run: dotnet restore OpenConnect.slnx --locked-mode

      - name: Build Release
        run: dotnet build OpenConnect.slnx -c Release --no-restore -warnaserror

      # Required legs exclude live-broker tests by default (S08): unit/fake
      # tests gate; live NATS never gates. Opt-in locally/adhoc with:
      #   $env:OPENCONNECT_TEST_NATS_URL='nats://localhost:4222'; dotnet test --filter "Category=NatsLive"
      # Disposable broker: docker run --rm -p 4222:4222 nats -js
      - name: Run tests
        run: dotnet test OpenConnect.slnx -c Release --no-build --filter "Category!=NatsLive"

      - name: Verify formatting
        run: dotnet format OpenConnect.slnx --verify-no-changes --no-restore

      - name: Check vulnerable dependencies
        shell: pwsh
        run: ./scripts/verify.ps1 -Security

      # Contract parity becomes executable when the contract test project lands.
      - name: Contract parity (pending contract test project)
        shell: pwsh
        run: ./scripts/verify.ps1 -ContractParity

  # EXPERIMENTAL-OBSERVATIONAL ONLY (orchestrator D-01): SDK 10 builds the
  # unchanged net8 TFMs. Informational; never required, never gates.
  # Zero TFM changes, zero version bumps (D-01/D-02).
  verify-sdk10-adversity:
    name: Verify SDK 10 builds net8 (experimental-observational)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET SDK 10
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restore locked dependencies
        run: dotnet restore OpenConnect.slnx --locked-mode

      - name: Build Release
        run: dotnet build OpenConnect.slnx -c Release --no-restore -warnaserror

      # Full suite. Container-gated tests self-skip without Docker (D-03:
      # no image pulls, no live containers, no Testcontainers execution in CI).
      # Required legs exclude live-broker tests by default (S08): unit/fake
      # tests gate; live NATS never gates. Opt-in locally/adhoc with:
      #   $env:OPENCONNECT_TEST_NATS_URL='nats://localhost:4222'; dotnet test --filter "Category=NatsLive"
      # Disposable broker: docker run --rm -p 4222:4222 nats -js
      - name: Run tests
        run: dotnet test OpenConnect.slnx -c Release --no-build --filter "Category!=NatsLive"

  # Real local-fixture cases run automatically and fail the workflow on errors.
  # Live server providers are separate explicit manual checks, not fake passes.
  e2e-per-sample:
    name: E2E per-sample (${{ matrix.case }})
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        case: [Minimal, Sqlite, InMemory, Blazor, Navigator]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          dotnet-version: 9.0.320

      - name: Run E2E case ${{ matrix.case }}
        shell: powershell
        run: |
          $case = "${{ matrix.case }}"
          $work = Join-Path $env:TEMP ("e2e-" + $case.ToLowerInvariant())
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          $logDir = Join-Path $work 'logs'
          New-Item -ItemType Directory -Force -Path $logDir | Out-Null
          $dbFile = Join-Path $work ($case.ToLowerInvariant() + '.db')
          & (Join-Path 'samples/EndToEnd/cases' ("Run-" + $case + ".ps1")) -RepoRoot . -DbFile $dbFile -LogDir $logDir
          exit $LASTEXITCODE

  postgres-offline-parity:
    name: PostgreSQL model parity (offline, not live persistence)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - run: dotnet restore samples/PostgreSql/OpenConnect.Samples.PostgreSql.csproj --locked-mode
      - run: dotnet run --project samples/PostgreSql/OpenConnect.Samples.PostgreSql.csproj --no-restore -- parity
      - name: State coverage boundary
        run: echo 'Live PostgreSQL and SQL Server persistence is NOT VERIFIED by ordinary CI; use the explicit live-provider dispatch with disposable fixtures.' >> "$GITHUB_STEP_SUMMARY"

  e2e-live-provider:
    name: Live provider (${{ inputs.live_provider }}, configured disposable fixture)
    if: github.event_name == 'workflow_dispatch' && inputs.live_provider != 'none'
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      OPENCONNECT_E2E_POSTGRES_HOST: ${{ vars.OPENCONNECT_E2E_POSTGRES_HOST }}
      OPENCONNECT_POSTGRESQL_CONNECTION: ${{ secrets.OPENCONNECT_E2E_POSTGRESQL_CONNECTION }}
      OPENCONNECT_E2E_SQLSERVER_HOST: ${{ vars.OPENCONNECT_E2E_SQLSERVER_HOST }}
      OPENCONNECT_SQLSERVER_CONNECTION: ${{ secrets.OPENCONNECT_E2E_SQLSERVER_CONNECTION }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Run explicitly selected disposable provider
        shell: powershell
        env:
          E2E_PROVIDER: ${{ inputs.live_provider }}
        run: |
          $logDir = Join-Path $env:TEMP ('e2e-live-' + $env:E2E_PROVIDER)
          New-Item -ItemType Directory -Force -Path $logDir | Out-Null
          & (Join-Path 'samples/EndToEnd/cases' ('Run-' + $env:E2E_PROVIDER + '.ps1')) -RepoRoot . -LogDir $logDir
          exit $LASTEXITCODE
