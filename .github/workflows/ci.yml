name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (.NET 8 targets · SDK 9)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v4.3.1
        with:
          dotnet-version: 9.0.320

      - name: Restore locked dependencies
        run: dotnet restore OpenConnect.slnx --locked-mode

      - name: Build Release
        run: dotnet build OpenConnect.slnx -c Release --no-restore -warnaserror

      - name: Run tests
        run: dotnet test OpenConnect.slnx -c Release --no-build

      - name: Verify formatting
        run: dotnet format OpenConnect.slnx --verify-no-changes --no-restore

      - name: Check vulnerable dependencies
        shell: pwsh
        run: ./scripts/verify.ps1 -Security

      # Contract parity becomes executable when the contract test project lands.
      - name: Contract parity (pending contract test project)
        shell: pwsh
        run: ./scripts/verify.ps1 -ContractParity
