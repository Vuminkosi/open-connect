port: 4222
http: 8222
jetstream {
  store_dir: "/data"
}
authorization {
  users: [
    { user: "$NATS_APP_USER", password: "$NATS_APP_PASSWORD" },
    {
      user: "$NATS_BOOTSTRAP_USER",
      password: "$NATS_BOOTSTRAP_PASSWORD",
      permissions: {
        publish: [
          "$JS.API.INFO",
          "$JS.API.STREAM.INFO.OC_NOTIFICATIONS",
          "$JS.API.STREAM.INFO.OC_INGESTION",
          "$JS.API.STREAM.CREATE.OC_NOTIFICATIONS",
          "$JS.API.STREAM.CREATE.OC_INGESTION",
          "oc.v1.>"
        ],
        subscribe: ["_INBOX.>", "oc.v1.>"]
      }
    }
  ]
}
