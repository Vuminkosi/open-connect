services:
  documentation-site:
    environment:
      OpenConnect__Assistant__Enabled: "true"
      OpenConnect__Assistant__EnableContinuousVoice: ${OC_DOCS_ASSISTANT_CONTINUOUS_VOICE:-true}
      OpenConnect__Assistant__GatewayUrl: https://localhost:8098/
      OpenConnect__Assistant__GatewayBearer: ""
      OpenConnect__Assistant__VisitorTenant: ${OC_DOCS_ASSISTANT_TENANT:?Set OC_DOCS_ASSISTANT_TENANT}
      OpenConnect__Assistant__VisitorSigningKey: ${OC_DOCS_ASSISTANT_VISITOR_KEY:?Set OC_DOCS_ASSISTANT_VISITOR_KEY}
      OpenConnect__Assistant__LiveUIWorkerEnabled: ${OC_DOCS_ASSISTANT_LIVEUI_WORKER_ENABLED:-false}
      OpenConnect__Assistant__LocalVoiceReadinessEnabled: "true"
      OpenConnect__Assistant__Model__Endpoint: ${OC_DOCS_ASSISTANT_MODEL_ENDPOINT:?Set OC_DOCS_ASSISTANT_MODEL_ENDPOINT}
      OpenConnect__Assistant__Model__Name: ${OC_DOCS_ASSISTANT_MODEL_NAME:?Set OC_DOCS_ASSISTANT_MODEL_NAME}
      OpenConnect__Assistant__Model__ApiKey: ${OC_DOCS_ASSISTANT_MODEL_API_KEY:?Set OC_DOCS_ASSISTANT_MODEL_API_KEY}
      Workers__Kokoro__Endpoint: http://worker-kokoro:8080
      Workers__Transcription__Endpoint: http://worker-transcription:8080
      Workers__Transcription__RealtimeLocalOnly: ${OC_DOCS_ASSISTANT_REALTIME_LOCAL_ONLY:-false}
      OpenConnect__ApiKey: ${OpenConnect__ApiKey:-}
      OpenConnect__ASR_WSS: ${OpenConnect__ASR_WSS:-}
      OpenConnect__ASR_Transcription__URL: ${OpenConnect__ASR_Transcription__URL:-}
      OpenConnect__ASR_MODEL: ${OpenConnect__ASR_MODEL:-}
      OpenConnect__ASRMode: ${OpenConnect__ASRMode:-}
      OpenConnect__Asr__Language: ${OpenConnect__Asr__Language:-}
      OPENCONNECT_WORKER_TOKEN: ${OPENCONNECT_WORKER_TOKEN:?Set OPENCONNECT_WORKER_TOKEN}
      OpenConnect__LiveUI__Inference__Worker__Endpoint: ${OC_DOCS_ASSISTANT_LIVEUI_WORKER_ENDPOINT:-}
      OpenConnect__LiveUI__Inference__Worker__Token: ${OC_DOCS_ASSISTANT_LIVEUI_WORKER_TOKEN:-}
      SSL_CERT_FILE: /run/docs-assistant-ca/ca-bundle.pem
    volumes:
      - ${OC_DOCS_ASSISTANT_CA_BUNDLE:?Set OC_DOCS_ASSISTANT_CA_BUNDLE}:/run/docs-assistant-ca/ca-bundle.pem:ro
