# Copy of .github/workflows/worker-sample-e2e.yml kept in samples/workers/shared/ci/ for local reference.
name: Worker Sample E2E

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      tier:
        description: Selected tier (static, contract, image-startup, integration, model-live, offline-revision, release)
        required: false
        default: contract
        type: string
      provider:
        description: Selected relational provider (sqlite, postgres, sqlserver)
        required: false
        default: sqlite
        type: string

permissions:
  contents: read

jobs:
  samples-workers-static-and-contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        worker: [security, classification, nllb, inference, transcription, realtime-voice, kokoro, mms-tts, navigator-playwright, operational-agents, outbox]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: ./samples/workers/shared/scripts/verify-no-build-models.sh "${{ matrix.worker }}"
      - run: ./samples/workers/shared/scripts/run-one.sh "${{ matrix.worker }}" --tier contract --provider sqlite
