# Shared dependency services for samples/workers e2e (T2/T3).
# Disposable NATS JetStream and sample-owned relational DBs (never production).
# Ordinary teardown uses `docker compose down --remove-orphans` (never `down -v`).

services:
  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "${NATS_PORT:-4222}:4222"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/varz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_DB: openconnect_e2e
      POSTGRES_USER: openconnect_test
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:-e2e-test-password-do-not-use-in-prod}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openconnect_test -d openconnect_e2e"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    profiles: ["sqlserver"]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQLSERVER_TEST_PASSWORD:-e2e-Test-Pass-Do-Not-Use-In-Prod-1!}
    ports:
      - "${SQLSERVER_PORT:-1433}:1433"
