name: oc-e2e-kokoro

# Standalone E2E stack for the Python Kokoro TTS worker (workers/kokoro).
# Runtime model cache lives in the named volume oc_kokoro_models; NO weights are baked into the image.

services:
  kokoro:
    image: vuminkosimatibe/openconnect-worker-kokoro:${OC_E2E_TAG:-e2e-local}
    build:
      context: ../../..
      dockerfile: workers/kokoro/Dockerfile
    environment:
      OPENCONNECT_WORKER_TOKEN: ${OPENCONNECT_WORKER_TOKEN:-e2e-test-token-do-not-use-in-prod}
      OC_WORKER_ENGINE: ${OC_WORKER_ENGINE:-fake}
      KOKORO_VOICES: ${KOKORO_VOICES:-af_heart,af_bella,am_adam}
      KOKORO_DEFAULT_VOICE: ${KOKORO_DEFAULT_VOICE:-af_heart}
      OC_MODEL_PROVISIONING: ${OC_MODEL_PROVISIONING:-disabled}
      OC_MODEL_CACHE_DIR: /models
      OC_MODEL_OFFLINE: ${OC_MODEL_OFFLINE:-true}
      OC_MODEL_DEVICE: ${OC_MODEL_DEVICE:-auto}
      OC_ENVIRONMENT: ${OC_ENVIRONMENT:-Development}
    volumes:
      - oc_kokoro_models:/models:ro
    ports:
      - "127.0.0.1:${PORT_KOKORO:-8086}:8080"
    networks:
      - oc-test-private
      - oc-test-host-bridge
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import sys,urllib.request;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health/live',timeout=2).status==200 else 1)"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  test-host:
    profiles: ["harness", "integration"]
    image: vuminkosimatibe/openconnect-worker-kokoro:${OC_E2E_TAG:-e2e-local}
    depends_on:
      kokoro:
        condition: service_healthy
    environment:
      WORKER_BASE_URL: http://kokoro:8080
      OPENCONNECT_WORKER_TOKEN: ${OPENCONNECT_WORKER_TOKEN:-e2e-test-token-do-not-use-in-prod}
    networks:
      - oc-test-private
    command: ["python", "-c", "import urllib.request; print(urllib.request.urlopen('http://kokoro:8080/health/ready', timeout=5).read().decode())"]

  e2e-test:
    profiles: ["harness", "integration"]
    image: vuminkosimatibe/openconnect-worker-kokoro:${OC_E2E_TAG:-e2e-local}
    depends_on:
      kokoro:
        condition: service_healthy
    environment:
      WORKER_BASE_URL: http://kokoro:8080
      OPENCONNECT_WORKER_TOKEN: ${OPENCONNECT_WORKER_TOKEN:-e2e-test-token-do-not-use-in-prod}
    volumes:
      - ./:/sample:ro
    networks:
      - oc-test-private
    command: ["python", "/sample/tests/test_e2e_acceptance.py"]

volumes:
  oc_kokoro_models:
    name: oc_kokoro_models

networks:
  oc-test-private:
    internal: true
  oc-test-host-bridge:
    driver: bridge
