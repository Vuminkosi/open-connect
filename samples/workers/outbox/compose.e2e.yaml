# E2E sample for the Outbox relay (.NET WorkerHost) — §5.11 (WSE2E-IMP-020, WSE2E-AT-073..080).
# T4 model-live: NOT_APPLICABLE / NOT_RUN (no ML models exist for this worker).
# Canonical image source:
#   src/OpenConnect.WorkerHosts.Outbox/Dockerfile (mirrored at workers/outbox/Dockerfile)
# No model volume and no model provisioner service are defined (WSE2E-AT-073).
# Embedded dispatcher disabled:
#   WorkerHosts__Outbox__Mode=Standalone
#   WorkerHosts__Outbox__EmbeddedDispatcherEnabled=false
# Migrations are MANUAL: the worker never runs DDL. Sample-owned migrations in ./Migrations/.
services:
  outbox:
    build:
      context: ../../..
      dockerfile: ${OUTBOX_DOCKERFILE:-src/OpenConnect.WorkerHosts.Outbox/Dockerfile}
    image: vuminkosimatibe/openconnect-worker-outbox:${OC_IMAGE_TAG:-e2e-local}
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    environment:
      WorkerHosts__Outbox__Mode: Standalone
      WorkerHosts__Outbox__EmbeddedDispatcherEnabled: "false"
      WorkerHosts__Outbox__TenantUlid: ${OC_OUTBOX_TENANT_ULID:-01ARZ3NDEKTSV4RRFFQ69G5FAV}
      WorkerHosts__Outbox__DatabaseProvider: ${OC_OUTBOX_DB_PROVIDER:-npgsql}
      WorkerHosts__Outbox__ConnectionString: ${OC_OUTBOX_CONNECTION_STRING:-Host=postgres;Port=5432;Database=${POSTGRES_DB:-openconnect};Username=${POSTGRES_USER:-openconnect};Password=${POSTGRES_PASSWORD:-e2e-test-pw-do-not-use-in-prod}}
      WorkerHosts__Outbox__NatsUrl: nats://nats:4222
      WorkerHosts__Outbox__Subject: ${NATS_NOTIFICATION_SUBJECT:-oc.v1.notifications.inapp}
      WorkerHosts__Outbox__PollingInterval: ${OC_OUTBOX_POLL_INTERVAL:-00:00:02}
      WorkerHosts__Outbox__SupervisorLeaseDuration: "00:00:30"
      WorkerHosts__Outbox__BatchSize: "50"
    networks:
      - oc-test-private

  postgres:
    image: postgis/postgis:17-3.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-openconnect}
      POSTGRES_USER: ${POSTGRES_USER:-openconnect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-e2e-test-pw-do-not-use-in-prod}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55434}:5432"
    networks:
      - oc-test-private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  nats:
    image: nats:2.15.1-alpine3.22
    command: ["-js", "-m", "8222"]
    ports:
      - "127.0.0.1:${NATS_HTTP_PORT:-8222}:8222"
    networks:
      - oc-test-private
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 12

networks:
  oc-test-private:
    internal: true
