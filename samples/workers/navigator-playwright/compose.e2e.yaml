# E2E sample for the Navigator Playwright worker (T0-T3). T4 model-live: BLOCKED/NOT_RUN.
# Canonical image source (never a toy worker image):
#   workers/navigator-playwright/Dockerfile
# Local tag only. The harness never pushes images and never downloads models.
# Project name is injected via COMPOSE_PROJECT_NAME (see shared/scripts/lib.sh)
# so parallel runs never share networks or volumes.
services:
  navigator-playwright:
    build:
      context: ../../../workers/navigator-playwright
      dockerfile: Dockerfile
    image: openconnect/navigator-playwright:e2e-local
    ports:
      - "${PORT_NAVIGATOR_PLAYWRIGHT:-8088}:8080"
    environment:
      NAVIGATOR_WORKER_TOKEN: ${NAVIGATOR_WORKER_TOKEN:-e2e-test-token-do-not-use-in-prod}
      NAVIGATOR_ALLOWED_ORIGINS: ${NAVIGATOR_ALLOWED_ORIGINS:-https://example.com}
      PLAYWRIGHT_LAUNCH: "0"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s
