# E2E sample for the Classification worker (T0-T3). T4 model-live: BLOCKED/NOT_RUN.
# Canonical image source (never a toy worker image):
#   workers/classification/Dockerfile
# Local tag only. The harness never pushes images and never downloads models.
# Project name is injected via COMPOSE_PROJECT_NAME (see shared/scripts/lib.sh)
# so parallel runs never share networks or volumes.
services:
  classification:
    build:
      context: ../../../workers/classification
      dockerfile: Dockerfile
    image: openconnect/classification:e2e-local
    ports:
      - "${PORT_CLASSIFICATION:-8081}:8080"
    environment:
      OPENCONNECT_WORKER_TOKEN: ${OPENCONNECT_WORKER_TOKEN:-e2e-test-token-do-not-use-in-prod}
      OC_WORKER_ENGINE: fake
      LICENSE_ACCEPTED: ${LICENSE_ACCEPTED:-0}
      OC_MODEL_DEVICE: ${OC_MODEL_DEVICE:-cpu}
      LABEL_SET_VERSION: v1
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s
