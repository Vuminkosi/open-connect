# OpenConnect FW-060 — Narrowly scoped OWASP CRS configuration & exclusions
# Engine: owasp/modsecurity-crs (Apache-2.0 license)
# Mode: Blocking (SecRuleEngine On)

# Fail closed on request body limit overflow (never silently pass oversized bodies)
SecRequestBodyAccess On
SecRequestBodyLimit 10485760
SecRequestBodyNoFilesLimit 131072
SecRequestBodyLimitAction Reject

# Content-free audit logging only:
# A = audit log header, Z = final boundary.
# Explicitly excludes B/C/E/F/I/J so raw headers, cookies, request bodies, and response bodies are NEVER logged.
SecAuditEngine RelevantOnly
SecAuditLogParts AZ

# Narrowly scoped exclusion for Blazor Server / SignalR circuit negotiation path only.
# Rationale: Blazor InteractiveServer negotiates WebSocket circuits under /_blazor and uses
# standard SignalR protocol frames that do not carry SQL/HTML payloads; global CRS remains active on all API routes.
SecRule REQUEST_URI "@beginsWith /_blazor" \
    "id:9009001,phase:1,pass,nolog,ctl:ruleRemoveById=920350,ctl:ruleRemoveById=920420"
