# E2E sample for the Operational Agents (.NET WorkerHost) — §5.10 (WSE2E-IMP-019, WSE2E-AT-066..072).
# T4 model-live: NOT_APPLICABLE / NOT_RUN (no ML models exist for this worker).
# Canonical image source:
#   src/OpenConnect.WorkerHosts.Operational/Dockerfile (mirrored at workers/operational-agents/Dockerfile)
# No model volume and no model provisioner service are defined (WSE2E-AT-066).
# Gateway embedded operational supervisor is explicitly disabled:
#   WorkerHosts__Operational__Mode=Standalone
#   WorkerHosts__Operational__EmbeddedEnabled=false
# Migrations are MANUAL: the worker never executes Database.Migrate or EnsureCreated.
# Sample-owned migrations live in ./Migrations/ and are applied before the worker starts.
services:
  operational-agents:
    build:
      context: ../../..
      dockerfile: ${OPERATIONAL_DOCKERFILE:-src/OpenConnect.WorkerHosts.Operational/Dockerfile}
    image: vuminkosimatibe/openconnect-worker-operational-agents:${OC_IMAGE_TAG:-e2e-local}
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      WorkerHosts__Operational__Mode: Standalone
      WorkerHosts__Operational__EmbeddedEnabled: "false"
      WorkerHosts__Operational__TenantUlid: ${OC_OPERATIONAL_TENANT_ULID:-01ARZ3NDEKTSV4RRFFQ69G5FAV}
      WorkerHosts__Operational__DatabaseProvider: ${OC_OPERATIONAL_DB_PROVIDER:-npgsql}
      WorkerHosts__Operational__ConnectionString: ${OC_OPERATIONAL_CONNECTION_STRING:-Host=postgres;Port=5432;Database=${POSTGRES_DB:-openconnect};Username=${POSTGRES_USER:-openconnect};Password=${POSTGRES_PASSWORD:-e2e-test-pw-do-not-use-in-prod}}
      WorkerHosts__Operational__SupervisorLeaseDuration: "00:00:30"
      WorkerHosts__Operational__RenewInterval: "00:00:10"
    networks:
      - oc-test-private

  postgres:
    image: postgis/postgis:17-3.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-openconnect}
      POSTGRES_USER: ${POSTGRES_USER:-openconnect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-e2e-test-pw-do-not-use-in-prod}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55433}:5432"
    networks:
      - oc-test-private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  sqlserver:
    profiles: ["sqlserver", "matrix"]
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-E2eTest_SqlSrv_do-not-use-in-prod!42}
    ports:
      - "127.0.0.1:${SQLSERVER_PORT:-51433}:1433"
    networks:
      - oc-test-private

networks:
  oc-test-private:
    internal: true
