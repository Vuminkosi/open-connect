# E2E sample for the Realtime voice worker (T0-T3). T4 model-live: BLOCKED/NOT_RUN.
# Canonical image source (never a toy worker image):
#   workers/realtime-voice/Dockerfile
# Local tag only. The harness never pushes images and never downloads models.
# Project name is injected via COMPOSE_PROJECT_NAME (see shared/scripts/lib.sh)
# so parallel runs never share networks or volumes.
services:
  realtime-voice:
    build:
      context: ../../../workers/realtime-voice
      dockerfile: Dockerfile
    image: openconnect/realtime-voice:e2e-local
    ports:
      - "${PORT_REALTIME_VOICE:-8085}:8080"
    environment:
      # T3 E2E (orchestration-only, explicitly fake-labeled, local-only): use
      # the app's canonical token var (OPENCONNECT_WORKER_TOKEN, which the app
      # reads) and the canonical engine switch (OC_WORKER_ENGINE=fake).
      # Fixture session id is synthetic E2E-only (see fixtures/request.json).
      OPENCONNECT_WORKER_TOKEN: ${OPENCONNECT_WORKER_TOKEN:-e2e-test-token-do-not-use-in-prod}
      OC_WORKER_ENGINE: fake
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s
