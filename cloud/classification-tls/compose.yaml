# Join the private network already shared by the Cloud gateway and worker.
services:
  classification-tls:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    user: "101:101"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=8m"]
    command: ["nginx", "-c", "/etc/nginx/nginx.conf", "-g", "daemon off;"]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ${CLOUD_CLASSIFICATION_TLS_SECRETS_DIR:-./secrets}:/run/classification-tls:ro
    networks: [cloud-private]
    restart: unless-stopped

networks:
  cloud-private:
    external: true
    name: ${CLOUD_CLASSIFICATION_NETWORK:?set the existing private gateway and worker network}
