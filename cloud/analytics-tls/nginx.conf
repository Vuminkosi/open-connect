worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr warn;
events { worker_connections 256; }
http {
    access_log off;
    client_max_body_size 350000;
    client_body_timeout 10s;
    client_header_timeout 10s;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    server {
        listen 8443 ssl;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_certificate /run/analytics-tls/server.crt;
        ssl_certificate_key /run/analytics-tls/server.key;
        ssl_client_certificate /run/analytics-tls/gateway-ca.crt;
        ssl_verify_client on;
        ssl_verify_depth 2;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 3s;
        proxy_send_timeout 10s;
        proxy_read_timeout 30s;
        proxy_pass_request_headers off;
        proxy_set_header Host worker-analytics;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Content-Type $http_content_type;
        proxy_set_header Content-Encoding $http_content_encoding;
        proxy_set_header Traceparent $http_traceparent;
        location = /internal/cloud/v1/analytics/ready { if ($request_method != GET) { return 405; } proxy_pass http://worker-analytics:8080; }
        location = /internal/cloud/v1/analytics/execute { if ($request_method != POST) { return 405; } proxy_pass http://worker-analytics:8080; }
        location / { return 404; }
    }
}
