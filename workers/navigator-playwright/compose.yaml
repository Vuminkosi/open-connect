name: navigator-playwright

services:
  navigator-playwright:
    build:
      context: .
      dockerfile: Dockerfile
    image: openconnect/navigator-playwright:0.1.0
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      # Fail-closed: worker refuses authenticated traffic until a token is set.
      NAVIGATOR_WORKER_TOKEN: ${NAVIGATOR_WORKER_TOKEN:-}
      NAVIGATOR_ALLOWED_ORIGINS: ${NAVIGATOR_ALLOWED_ORIGINS:-https://example.com}
      PLAYWRIGHT_LAUNCH: "1"
    tmpfs:
      # Per-run browser profiles only; nothing persisted. No model volume.
      - /tmp/nav-tmp:noexec,nosuid,size=512m
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
