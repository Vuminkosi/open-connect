# Classification worker compose bundle.
#
# The model volume is populated by the startup provisioner or out of band.
# No request-time download is permitted: HF_HUB_OFFLINE=1 is set on the worker
# service.
name: openconnect-classification

services:
  model-init:
    image: python:3.12-slim
    volumes:
      - oc_classification_models:/models:ro
    command:
      - python
      - -c
      - >-
        import pathlib, sys;
        need = ["manifest.json"];
        missing = [n for n in need if not (pathlib.Path("/models") / n).exists()];
        weights = list(pathlib.Path("/models").glob("*.bin")) + list(pathlib.Path("/models").glob("*.safetensors"));
        print("model-init: checking /models volume (no downloads permitted)");
        sys.exit("model-init: REFUSING to download. Mount a pinned checkpoint: /models/manifest.json + weights (*.bin/*.safetensors). See workers/classification/README-model.md") if (missing or not weights) else print("model-init: manifest + weights present")
    restart: "no"

  classification:
    build:
      context: .
      dockerfile: Dockerfile
    image: vuminkosimatibe/openconnect-worker-classification:${OC_IMAGE_TAG:-e2e-local}
    depends_on:
      model-init:
        condition: service_completed_successfully
    environment:
      MODEL_DIR: /models
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      # Deprecated alias; OC_WORKER_ENGINE wins when set.
      OPENCONNECT_FAKE_ENGINE: ${OPENCONNECT_FAKE_ENGINE:-0}
      OPENCONNECT_ENV: ${OPENCONNECT_ENV:-}
      OC_ENVIRONMENT: ${OC_ENVIRONMENT:-Production}
      OC_MODEL_DEVICE: ${OC_MODEL_DEVICE:-auto}
      # Canonical OC_* defaults (workers-model-defaults contract). Secrets
      # stay placeholders -- never real values.
      OC_WORKER_ENGINE: ${OC_WORKER_ENGINE:-real}
      OC_MODEL_PROVISIONING: ${OC_MODEL_PROVISIONING:-first-start-if-missing}
      OC_MODEL_CACHE_DIR: ${OC_MODEL_CACHE_DIR:-/models}
      OC_MODEL_OFFLINE: ${OC_MODEL_OFFLINE:-false}
      OPENCONNECT_WORKER_TOKEN: ${OPENCONNECT_WORKER_TOKEN:?set a worker bearer token}
      LABEL_SET_VERSION: ${LABEL_SET_VERSION:-v1}
      LICENSE_ACCEPTED: ${LICENSE_ACCEPTED:-0}
    volumes:
      - oc_classification_models:/models:ro
    ports:
      - "${CLASSIFICATION_PORT:-8080}:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/live', timeout=2)"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  oc_classification_models:
    name: oc_classification_models
