[project]
name = "openconnect-nllb-worker"
version = "0.1.0"
description = "Local NLLB translation worker for OpenConnect (explicit pairs, fake-engine CI mode)"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.12",
  "pydantic==2.11.3",
  "uvicorn[standard]==0.54.0",
]

[project.optional-dependencies]
local-decoder = [
  "torch==2.7.1; python_version < '3.14'",
  "transformers==5.23.0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = ["httpx==0.28.1", "jsonschema==4.23.0", "pytest==8.3.5", "ruff==0.11.8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
