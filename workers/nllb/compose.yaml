# NLLB translation worker compose bundle.
#
# The model volume is populated OUT OF BAND (pinned NLLB checkpoint copied by
# an operator or baked into a versioned image). `model-init` never downloads:
# it verifies the selected active versioned bundle and license, and exits
# non-zero when the volume is incomplete. No
# request-time download is permitted: HF_HUB_OFFLINE=1 is set on the worker
# service and the engine refuses any network fetch. No remote fallback exists.
name: openconnect-nllb

services:
  model-init:
    build:
      context: .
      args:
        OC_NLLB_INSTALL_DECODER: ${OC_NLLB_INSTALL_DECODER:-false}
    image: vuminkosimatibe/openconnect-worker-nllb:${OC_IMAGE_TAG:-e2e-local}
    environment:
      OC_MODEL_CACHE_DIR: /models
      OC_NLLB_MODEL_ID: ${OC_NLLB_MODEL_ID:-}
      OC_NLLB_COMMERCIAL_USE: ${OC_NLLB_COMMERCIAL_USE:-true}
      LICENSE_ACCEPTED: ${LICENSE_ACCEPTED:-0}
      OC_WORKER_ENGINE: ${OC_WORKER_ENGINE:-real}
      OC_ENVIRONMENT: ${OC_ENVIRONMENT:-Production}
    volumes:
      - oc_nllb_models:/models:ro
    command: ["python", "-m", "openconnect_nllb.init_models"]
    network_mode: none
    restart: "no"

  nllb:
    build:
      context: .
      args:
        OC_NLLB_INSTALL_DECODER: ${OC_NLLB_INSTALL_DECODER:-false}
    image: vuminkosimatibe/openconnect-worker-nllb:${OC_IMAGE_TAG:-e2e-local}
    depends_on:
      model-init:
        condition: service_completed_successfully
    environment:
      MODEL_DIR: /models
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      # Deprecated alias; OC_WORKER_ENGINE wins when set.
      OPENCONNECT_FAKE_ENGINE: ${OPENCONNECT_FAKE_ENGINE:-0}
      OPENCONNECT_ENV: ${OPENCONNECT_ENV:-}
      OC_ENVIRONMENT: ${OC_ENVIRONMENT:-Production}
      OC_MODEL_DEVICE: ${OC_MODEL_DEVICE:-auto}
      # Canonical OC_* defaults (workers-model-defaults contract). Secrets
      # stay placeholders -- never real values.
      OC_WORKER_ENGINE: ${OC_WORKER_ENGINE:-real}
      OC_MODEL_PROVISIONING: ${OC_MODEL_PROVISIONING:-first-start-if-missing}
      OC_MODEL_CACHE_DIR: ${OC_MODEL_CACHE_DIR:-/models}
      OC_MODEL_OFFLINE: ${OC_MODEL_OFFLINE:-false}
      OC_NLLB_MODEL_ID: ${OC_NLLB_MODEL_ID:-}
      OC_NLLB_COMMERCIAL_USE: ${OC_NLLB_COMMERCIAL_USE:-true}
      OPENCONNECT_WORKER_TOKEN: ${OPENCONNECT_WORKER_TOKEN:?set a worker bearer token}
      LICENSE_ACCEPTED: ${LICENSE_ACCEPTED:-0}
    volumes:
      - oc_nllb_models:/models:ro
    ports:
      - "${NLLB_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  oc_nllb_models:
    name: oc_nllb_models
