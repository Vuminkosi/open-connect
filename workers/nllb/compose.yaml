# NLLB translation worker compose bundle.
#
# The model volume is populated OUT OF BAND (pinned NLLB checkpoint copied by
# an operator or baked into a versioned image). `model-init` never downloads:
# it only verifies that /models holds manifest.json + weights + tokenizer,
# and exits non-zero with instructions when the volume is incomplete. No
# request-time download is permitted: HF_HUB_OFFLINE=1 is set on the worker
# service and the engine refuses any network fetch. No remote fallback exists.
name: openconnect-nllb

services:
  model-init:
    image: python:3.12-slim
    volumes:
      - oc_nllb_models:/models:ro
    command:
      - python
      - -c
      - >-
        import pathlib, sys;
        ok = (pathlib.Path("/models") / "manifest.json").exists() and bool(list(pathlib.Path("/models").glob("*.bin")) + list(pathlib.Path("/models").glob("*.safetensors"))) and ((pathlib.Path("/models") / "tokenizer.json").exists() or (pathlib.Path("/models") / "sentencepiece.bpe.model").exists());
        print("model-init: checking /models volume (no downloads permitted)");
        sys.exit("model-init: REFUSING to download. Mount a pinned NLLB checkpoint: /models/manifest.json + weights (*.bin/*.safetensors) + tokenizer (tokenizer.json or sentencepiece.bpe.model). See workers/nllb/README-model.md") if not ok else print("model-init: manifest + weights + tokenizer present")
    restart: "no"

  nllb:
    build:
      context: .
    image: openconnect-nllb:0.1.0
    depends_on:
      model-init:
        condition: service_completed_successfully
    environment:
      MODEL_DIR: /models
      HF_HUB_OFFLINE: "1"
      OPENCONNECT_FAKE_ENGINE: ${OPENCONNECT_FAKE_ENGINE:-0}
      OPENCONNECT_ENV: ${OPENCONNECT_ENV:-}
      OC_MODEL_DEVICE: ${OC_MODEL_DEVICE:-auto}
      OPENCONNECT_WORKER_TOKEN: ${OPENCONNECT_WORKER_TOKEN:?set a worker bearer token}
      LICENSE_ACCEPTED: ${LICENSE_ACCEPTED:-0}
    volumes:
      - oc_nllb_models:/models:ro
    ports:
      - "${NLLB_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  oc_nllb_models:
    name: oc_nllb_models
