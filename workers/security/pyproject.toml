[project]
name = "openconnect-security-worker"
version = "0.1.0"
description = "Local rules-based privacy scanning worker for OpenConnect"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.162.0",
  "pydantic==2.11.3",
  "uvicorn[standard]==0.34.2",
]

[dependency-groups]
dev = ["httpx==0.28.1", "jsonschema==4.23.0", "pytest==8.3.5", "ruff==0.11.8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
