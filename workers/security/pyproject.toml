[project]
name = "openconnect-security-worker"
version = "0.1.0"
description = "Local privacy, malware, and AI firewall scanning worker for OpenConnect"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.162.5",
  "openconnect-worker-common",
  "pillow==11.2.1",
  "pydantic==2.11.3",
  "python-multipart==0.0.20",
  "uvicorn[standard]==0.54.0",
]

[project.optional-dependencies]
gliner = ["gliner>=0.2.16,<0.3", "onnxruntime>=1.20.0,<2"]
deberta = ["transformers>=4.49.0,<5", "torch>=2.6.0,<3"]
ocr = ["paddleocr>=2.9.1,<3", "numpy>=1.26.4,<3"]
yunet = ["opencv-python-headless>=4.11.0.86,<5", "numpy>=1.26.4,<3"]
all-models = [
  "gliner>=0.2.16,<0.3",
  "onnxruntime>=1.20.0,<2",
  "transformers>=4.49.0,<5",
  "torch>=2.6.0,<3",
  "paddleocr>=2.9.1,<3",
  "opencv-python-headless>=4.11.0.86,<5",
  "numpy>=1.26.4,<3",
]

[tool.uv.sources]
openconnect-worker-common = { path = "../common" }

[dependency-groups]
dev = ["httpx==0.28.1", "jsonschema==4.26.0", "pytest==9.2.0", "ruff==0.17.6"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "real_models: opt-in real CPU model acceptance tests (set OC_RUN_REAL_MODEL_TESTS=1)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
