[project]
name = "openconnect-worker-common"
version = "0.1.0"
description = "Shared Python contracts, security, transport, and model helpers for OpenConnect workers"
requires-python = ">=3.12"
dependencies = [
  "pydantic==2.11.3",
]

[dependency-groups]
dev = ["jsonschema==4.23.0", "pytest==8.3.5", "ruff==0.11.8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
