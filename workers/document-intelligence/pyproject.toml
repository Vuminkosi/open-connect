[project]
name = "openconnect-document-intelligence"
version = "0.1.0"
description = "CPU-first document intelligence for OpenConnect"
requires-python = ">=3.12,<3.13"
dependencies = ["openconnect-worker-common", "pillow==11.2.1"]

[tool.uv.sources]
openconnect-worker-common = { path = "../common" }

[dependency-groups]
dev = ["pytest==8.3.5", "ruff==0.11.8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
