# OpenConnect inference worker compose profile.
#
# Model weights are NEVER downloaded by the serving container. The
# `model-init` step provisions only a signed manifest placeholder into the
# named volume; `serve` mounts that volume read-only and runs fully offline
# (HF_HUB_OFFLINE=1, TRANSFORMERS_OFFLINE=1).
name: openconnect-inference

services:
  model-init:
    image: busybox:1.36
    command:
      - sh
      - -c
      - |
        mkdir -p /models
        printf '{"modelId":"none","revision":"none","license":"none","provisionedBy":"model-init","note":"fake-bounded engine requires no weights"}' > /models/model-manifest.json
        chmod 0444 /models/model-manifest.json
    volumes:
      - oc_inference_models:/models

  serve:
    build:
      context: .
      dockerfile: Dockerfile
    image: openconnect-inference:0.1.0
    ports:
      - "8080:8080"
    environment:
      OPENCONNECT_INFERENCE_TOKEN: ${OPENCONNECT_INFERENCE_TOKEN:-}
      OPENCONNECT_FAKE_ENGINE: ${OPENCONNECT_FAKE_ENGINE:-0}
      OPENCONNECT_ENV: ${OPENCONNECT_ENV:-}
      OC_MODEL_DEVICE: ${OC_MODEL_DEVICE:-auto}
      # Cloud is opt-in only (empty = local-only). A shared URL can be wired
      # per deploy via INFERENCE_CLOUD_URL: ${WORKER_CLOUD_URL:-}. The API key
      # must come from a secret mount, never baked into images or logs.
      INFERENCE_CLOUD_URL: ${INFERENCE_CLOUD_URL:-}
      INFERENCE_CLOUD_API_KEY: ${INFERENCE_CLOUD_API_KEY:-}
      INFERENCE_ROUTE_ORDER: ${INFERENCE_ROUTE_ORDER:-cloud-first}
      INFERENCE_CLOUD_TIMEOUT_MS: ${INFERENCE_CLOUD_TIMEOUT_MS:-5000}
      INFERENCE_BACKEND: ${INFERENCE_BACKEND:-python-transformers}
      INFERENCE_MODEL_ID: ${INFERENCE_MODEL_ID:-}
      INFERENCE_MODEL_REVISION: ${INFERENCE_MODEL_REVISION:-}
      INFERENCE_ENDPOINT_URL: ${INFERENCE_ENDPOINT_URL:-}
      INFERENCE_ENABLE_TOOLS: ${INFERENCE_ENABLE_TOOLS:-0}
      INFERENCE_ENABLE_STRUCTURED_OUTPUT: ${INFERENCE_ENABLE_STRUCTURED_OUTPUT:-0}
      INFERENCE_ENABLE_EMBEDDINGS: ${INFERENCE_ENABLE_EMBEDDINGS:-0}
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      MODEL_DIR: /models
    volumes:
      - oc_inference_models:/models:ro
    depends_on:
      model-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

volumes:
  oc_inference_models:
    name: oc_inference_models
