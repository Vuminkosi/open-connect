[project]
name = "openconnect-transcription-worker"
version = "0.1.0"
description = "Local transcription worker for OpenConnect (bounded fake STT engine)"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.12",
  "pydantic==2.11.3",
  "uvicorn[standard]==0.54.0",
  "websockets==17.4",
]

[dependency-groups]
dev = ["httpx==0.28.1", "jsonschema==4.23.0", "pytest==8.3.5", "ruff==0.11.8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
