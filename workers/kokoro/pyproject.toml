[project]
name = "openconnect-kokoro-worker"
version = "0.2.0"
description = "Local-only Kokoro af_heart TTS worker for OpenConnect"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.115.12",
  "kokoro==0.9.4",
  "misaki[en]==0.9.4",
  "numpy==2.3.4",
  "pydantic==2.11.3",
  "spacy==3.8.7",
  "torch==2.7.1",
  "uvicorn[standard]==0.34.3",
  "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = ["httpx==0.28.1", "jsonschema==4.23.0", "pytest==8.3.5", "ruff==0.11.8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
