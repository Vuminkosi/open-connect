openapi: 3.1.0
info:
  title: OpenConnect API
  version: 1.0.0
  description: OpenConnect HTTP contract. Task requests and records use the host task wire format.
servers:
  - url: /openconnect/v1
paths:
  /tasks:
    post:
      operationId: acceptTask
      summary: Accept a task
      security: [{ bearerAuth: [] }]
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 1, maxLength: 256 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientTaskId]
              properties:
                clientTaskId: { type: string, minLength: 1, maxLength: 128 }
                sessionId: { oneOf: [{ $ref: '#/components/schemas/Ulid' }, { type: 'null' }] }
                message: { type: [string, 'null'], maxLength: 32000 }
      responses:
        '202':
          description: Task accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskRecord' }
        '400': { description: Invalid request }
        '401': { description: Authentication required }
        '409':
          description: Idempotency conflict
          content:
            application/problem+json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Problem' }
                  - type: object
                    properties:
                      type: { const: 'https://openconnect.dev/problems/idempotency-conflict' }
                      status: { const: 409 }
  /tasks/{id}:
    get:
      operationId: getTask
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { $ref: '#/components/schemas/Ulid' }
      responses:
        '200':
          description: Task record
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskRecord' }
        '400': { description: Invalid task ID }
        '401': { description: Authentication required }
        '404':
          description: Task not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /tasks/{id}/cancel:
    post:
      operationId: cancelTask
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { $ref: '#/components/schemas/Ulid' }
      responses:
        '200':
          description: Cancellation result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskRecord' }
        '400': { description: Invalid task ID }
        '401': { description: Authentication required }
        '404': { description: Task not found }
  /capabilities/ready:
    get:
      operationId: listReadyHostCapabilities
      summary: List ready host registry capabilities across all kinds
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Non-expired, ready host registry descriptors
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [id, kind, state]
                  properties:
                    id:
                      type: object
                      additionalProperties: false
                      required: [value]
                      properties:
                        value: { type: string, minLength: 1 }
                    kind: { type: string, enum: [security, model, tool, transport] }
                    state: { const: ready }
        '401': { description: Authentication required }
  /sessions/{sessionId}/events:
    get:
      operationId: replayEvents
      summary: Replay session events after a cursor
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: afterSequence
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Events after the supplied sequence
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '../jsonschema/event.json' }
        '401': { description: Authentication required }
        '404': { description: Session not found }
components:
  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
    Ulid:
      type: string
      pattern: '^(?!0{26}$)[0-7][0-9A-HJKMNP-TV-Z]{25}$'
      description: Nonzero canonical uppercase ULID.
    TaskRecord:
      type: object
      additionalProperties: false
      required: [id, tenantId, principalId, state]
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        tenantId: { $ref: '#/components/schemas/Ulid' }
        principalId: { $ref: '#/components/schemas/Ulid' }
        state:
          type: string
          enum: [accepted, preparing, running, awaiting-user, awaiting-approval, paused, completed, failed, cancel-requested, cancelled, outcome-unknown]
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
